<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Три пути подключения к каскаду KalimeraWG</title>
  <desc id="desc">Клиент выбирает прямой AmneziaWG, прямой VLESS Reality или подтверждённый резерв через совместимый облачный CDN и FRONT. После ENTRY российский трафик идёт через SOCKS5 либо напрямую, а остальной — через AWG3 на EXIT.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#a371f7"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#39c5cf"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#f0a33b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#3fb950"/>
    </marker>
  </defs>

  <rect width="1440" height="760" rx="24" fill="#0d1117"/>
  <rect x="1" y="1" width="1438" height="758" rx="23" fill="none" stroke="#30363d" stroke-width="2"/>

  <text x="48" y="52" fill="#f0f6fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">KalimeraWG · доступ при обычной сети и белых списках</text>
  <text x="48" y="84" fill="#8b949e" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Три независимых входа сходятся в одной политике маршрутизации ENTRY</text>

  <rect x="250" y="112" width="580" height="500" rx="18" fill="#111820" stroke="#263442" stroke-width="2"/>
  <text x="274" y="143" fill="#8b949e" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">ВАРИАНТЫ ВХОДА</text>
  <rect x="838" y="112" width="562" height="500" rx="18" fill="#12161d" stroke="#30363d" stroke-width="2"/>
  <text x="862" y="143" fill="#8b949e" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">ЕДИНАЯ СЕРВЕРНАЯ ПОЛИТИКА</text>

  <path d="M 225 374 C 248 374 246 198 270 198" fill="none" stroke="#58a6ff" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <path d="M 225 388 H 270" fill="none" stroke="#a371f7" stroke-width="4" marker-end="url(#arrow-purple)"/>
  <path d="M 225 402 C 248 402 246 520 270 520" fill="none" stroke="#39c5cf" stroke-width="5" marker-end="url(#arrow-cyan)"/>

  <path d="M 530 198 C 650 198 710 320 850 332" fill="none" stroke="#58a6ff" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <path d="M 530 350 H 850" fill="none" stroke="#a371f7" stroke-width="4" marker-end="url(#arrow-purple)"/>
  <path d="M 530 520 H 590" fill="none" stroke="#39c5cf" stroke-width="5" marker-end="url(#arrow-cyan)"/>
  <path d="M 810 520 C 825 520 830 392 850 380" fill="none" stroke="#39c5cf" stroke-width="5" marker-end="url(#arrow-cyan)"/>

  <path d="M 1020 355 H 1050" fill="none" stroke="#b1bac4" stroke-width="4" marker-end="url(#arrow-purple)"/>
  <path d="M 1220 330 C 1232 330 1232 244 1245 244" fill="none" stroke="#f0a33b" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <path d="M 1220 382 C 1232 382 1232 468 1245 468" fill="none" stroke="#3fb950" stroke-width="4" marker-end="url(#arrow-green)"/>

  <g filter="url(#shadow)">
    <rect x="40" y="330" width="185" height="116" rx="14" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
    <text x="132" y="376" text-anchor="middle" fill="#f0f6fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Клиент</text>
    <text x="132" y="409" text-anchor="middle" fill="#b1bac4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">телефон · роутер</text>

    <rect x="270" y="155" width="260" height="86" rx="14" fill="#13243a" stroke="#58a6ff" stroke-width="3"/>
    <text x="400" y="188" text-anchor="middle" fill="#f0f6fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">AmneziaWG 3+</text>
    <text x="400" y="218" text-anchor="middle" fill="#79c0ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">UDP/443 · основной путь</text>

    <rect x="270" y="307" width="260" height="86" rx="14" fill="#211a36" stroke="#a371f7" stroke-width="3"/>
    <text x="400" y="340" text-anchor="middle" fill="#f0f6fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">VLESS + REALITY</text>
    <text x="400" y="370" text-anchor="middle" fill="#d2a8ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">TCP/443 · прямой резерв</text>

    <rect x="270" y="474" width="260" height="92" rx="14" fill="#123239" stroke="#39c5cf" stroke-width="4"/>
    <text x="400" y="509" text-anchor="middle" fill="#f0f6fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Облачный CDN</text>
    <text x="400" y="540" text-anchor="middle" fill="#7ee7ea" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">TLS + VLESS/XHTTP · TCP/443</text>

    <rect x="590" y="474" width="220" height="92" rx="14" fill="#352b16" stroke="#d8b64c" stroke-width="3"/>
    <text x="700" y="509" text-anchor="middle" fill="#f0f6fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">FRONT</text>
    <text x="700" y="540" text-anchor="middle" fill="#e8d38a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">Nginx + Xray-core</text>

    <rect x="850" y="290" width="170" height="130" rx="14" fill="#211a36" stroke="#a371f7" stroke-width="3"/>
    <text x="935" y="340" text-anchor="middle" fill="#f0f6fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">ENTRY</text>
    <text x="935" y="373" text-anchor="middle" fill="#d2a8ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">единая точка</text>
    <text x="935" y="397" text-anchor="middle" fill="#d2a8ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">маршрутизации</text>

    <rect x="1050" y="290" width="170" height="130" rx="14" fill="#20252b" stroke="#8b949e" stroke-width="2"/>
    <text x="1135" y="335" text-anchor="middle" fill="#f0f6fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Политика</text>
    <text x="1135" y="366" text-anchor="middle" fill="#b1bac4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">домены · сети</text>
    <text x="1135" y="392" text-anchor="middle" fill="#b1bac4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">DNS · fail-open</text>

    <rect x="1245" y="191" width="155" height="106" rx="14" fill="#382614" stroke="#f0a33b" stroke-width="3"/>
    <text x="1322" y="229" text-anchor="middle" fill="#f0f6fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">RU</text>
    <text x="1322" y="257" text-anchor="middle" fill="#f2cc8f" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">SOCKS5/TUN</text>
    <text x="1322" y="279" text-anchor="middle" fill="#f2cc8f" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">или WAN ENTRY</text>

    <rect x="1245" y="415" width="155" height="106" rx="14" fill="#173523" stroke="#3fb950" stroke-width="3"/>
    <text x="1322" y="453" text-anchor="middle" fill="#f0f6fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">EXIT</text>
    <text x="1322" y="481" text-anchor="middle" fill="#7ee787" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">AWG 3+</text>
    <text x="1322" y="503" text-anchor="middle" fill="#7ee787" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">остальной трафик</text>
  </g>

  <rect x="270" y="586" width="540" height="36" rx="18" fill="#123239" stroke="#2b747b" stroke-width="1"/>
  <text x="540" y="610" text-anchor="middle" fill="#7ee7ea" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">ПОДТВЕРЖДЕНО В ПОЛЕВОМ ТЕСТЕ: CDN → FRONT → ENTRY</text>

  <line x1="48" y1="652" x2="1392" y2="652" stroke="#30363d" stroke-width="1"/>
  <text x="48" y="685" fill="#f0f6fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Что доказал тест</text>
  <text x="48" y="713" fill="#8b949e" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">Новая сессия прошла через CDN при активном режиме белых списков и сохранила политики RU/EXIT после ENTRY.</text>
  <text x="48" y="739" fill="#8b949e" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">Результат относится к проверенной сети и моменту времени; доступность CDN зависит от оператора, региона и его текущей политики.</text>
</svg>
