<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Three access paths into the KalimeraWG cascade</title>
  <desc id="desc">The client selects direct AmneziaWG, direct VLESS Reality, or the field-validated compatible cloud CDN and FRONT fallback. After ENTRY, Russian traffic uses SOCKS5 or ENTRY WAN while all other traffic uses AWG3 to EXIT.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.28"/></filter>
    <marker id="ab" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L12 6L0 12z" fill="#58a6ff"/></marker>
    <marker id="ap" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L12 6L0 12z" fill="#a371f7"/></marker>
    <marker id="ac" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L12 6L0 12z" fill="#39c5cf"/></marker>
    <marker id="ao" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L12 6L0 12z" fill="#f0a33b"/></marker>
    <marker id="ag" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L12 6L0 12z" fill="#3fb950"/></marker>
  </defs>
  <rect width="1440" height="760" rx="24" fill="#0d1117"/><rect x="1" y="1" width="1438" height="758" rx="23" fill="none" stroke="#30363d" stroke-width="2"/>
  <text x="48" y="52" fill="#f0f6fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">KalimeraWG · regular networks and allowlist mode</text>
  <text x="48" y="84" fill="#8b949e" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Three independent ingress paths converge on one ENTRY routing policy</text>
  <rect x="250" y="112" width="580" height="500" rx="18" fill="#111820" stroke="#263442" stroke-width="2"/><text x="274" y="143" fill="#8b949e" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">INGRESS OPTIONS</text>
  <rect x="838" y="112" width="562" height="500" rx="18" fill="#12161d" stroke="#30363d" stroke-width="2"/><text x="862" y="143" fill="#8b949e" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">SHARED SERVER POLICY</text>
  <path d="M225 374C248 374 246 198 270 198" fill="none" stroke="#58a6ff" stroke-width="4" marker-end="url(#ab)"/><path d="M225 388H270" fill="none" stroke="#a371f7" stroke-width="4" marker-end="url(#ap)"/><path d="M225 402C248 402 246 520 270 520" fill="none" stroke="#39c5cf" stroke-width="5" marker-end="url(#ac)"/>
  <path d="M530 198C650 198 710 320 850 332" fill="none" stroke="#58a6ff" stroke-width="4" marker-end="url(#ab)"/><path d="M530 350H850" fill="none" stroke="#a371f7" stroke-width="4" marker-end="url(#ap)"/><path d="M530 520H590" fill="none" stroke="#39c5cf" stroke-width="5" marker-end="url(#ac)"/><path d="M810 520C825 520 830 392 850 380" fill="none" stroke="#39c5cf" stroke-width="5" marker-end="url(#ac)"/>
  <path d="M1020 355H1050" fill="none" stroke="#b1bac4" stroke-width="4" marker-end="url(#ap)"/><path d="M1220 330C1232 330 1232 244 1245 244" fill="none" stroke="#f0a33b" stroke-width="4" marker-end="url(#ao)"/><path d="M1220 382C1232 382 1232 468 1245 468" fill="none" stroke="#3fb950" stroke-width="4" marker-end="url(#ag)"/>
  <g filter="url(#shadow)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="40" y="330" width="185" height="116" rx="14" fill="#161b22" stroke="#8b949e" stroke-width="2"/><text x="132" y="376" text-anchor="middle" fill="#f0f6fc" font-size="24" font-weight="700">Client</text><text x="132" y="409" text-anchor="middle" fill="#b1bac4" font-size="17">phone · router</text>
    <rect x="270" y="155" width="260" height="86" rx="14" fill="#13243a" stroke="#58a6ff" stroke-width="3"/><text x="400" y="188" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="700">AmneziaWG 3+</text><text x="400" y="218" text-anchor="middle" fill="#79c0ff" font-size="16">UDP/443 · primary path</text>
    <rect x="270" y="307" width="260" height="86" rx="14" fill="#211a36" stroke="#a371f7" stroke-width="3"/><text x="400" y="340" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="700">VLESS + REALITY</text><text x="400" y="370" text-anchor="middle" fill="#d2a8ff" font-size="16">TCP/443 · direct fallback</text>
    <rect x="270" y="474" width="260" height="92" rx="14" fill="#123239" stroke="#39c5cf" stroke-width="4"/><text x="400" y="509" text-anchor="middle" fill="#f0f6fc" font-size="21" font-weight="700">Cloud CDN</text><text x="400" y="540" text-anchor="middle" fill="#7ee7ea" font-size="16">TLS + VLESS/XHTTP · TCP/443</text>
    <rect x="590" y="474" width="220" height="92" rx="14" fill="#352b16" stroke="#d8b64c" stroke-width="3"/><text x="700" y="509" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="700">FRONT</text><text x="700" y="540" text-anchor="middle" fill="#e8d38a" font-size="16">Nginx + Xray-core</text>
    <rect x="850" y="290" width="170" height="130" rx="14" fill="#211a36" stroke="#a371f7" stroke-width="3"/><text x="935" y="340" text-anchor="middle" fill="#f0f6fc" font-size="28" font-weight="700">ENTRY</text><text x="935" y="373" text-anchor="middle" fill="#d2a8ff" font-size="16">shared routing</text><text x="935" y="397" text-anchor="middle" fill="#d2a8ff" font-size="16">and DNS policy</text>
    <rect x="1050" y="290" width="170" height="130" rx="14" fill="#20252b" stroke="#8b949e" stroke-width="2"/><text x="1135" y="335" text-anchor="middle" fill="#f0f6fc" font-size="21" font-weight="700">Policy</text><text x="1135" y="366" text-anchor="middle" fill="#b1bac4" font-size="16">domains · IP sets</text><text x="1135" y="392" text-anchor="middle" fill="#b1bac4" font-size="16">DNS · fail-open</text>
    <rect x="1245" y="191" width="155" height="106" rx="14" fill="#382614" stroke="#f0a33b" stroke-width="3"/><text x="1322" y="229" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="700">RU</text><text x="1322" y="257" text-anchor="middle" fill="#f2cc8f" font-size="15">SOCKS5/TUN</text><text x="1322" y="279" text-anchor="middle" fill="#f2cc8f" font-size="15">or ENTRY WAN</text>
    <rect x="1245" y="415" width="155" height="106" rx="14" fill="#173523" stroke="#3fb950" stroke-width="3"/><text x="1322" y="453" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="700">EXIT</text><text x="1322" y="481" text-anchor="middle" fill="#7ee787" font-size="15">AWG 3+</text><text x="1322" y="503" text-anchor="middle" fill="#7ee787" font-size="15">all other traffic</text>
  </g>
  <rect x="270" y="586" width="540" height="36" rx="18" fill="#123239" stroke="#2b747b"/><text x="540" y="610" text-anchor="middle" fill="#7ee7ea" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">FIELD-VALIDATED PATH: CDN → FRONT → ENTRY</text>
  <line x1="48" y1="652" x2="1392" y2="652" stroke="#30363d"/><text x="48" y="685" fill="#f0f6fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">What the validation established</text><text x="48" y="713" fill="#8b949e" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">A new session crossed the CDN under active allowlist restrictions and retained the existing RU/EXIT policy after ENTRY.</text><text x="48" y="739" fill="#8b949e" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">The result applies to the tested network and time; CDN reachability still depends on the carrier, region, and current policy.</text>
</svg>
