<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">KalimeraWG routing diagram</title>
  <desc id="desc">The VPN client connects to ENTRY. Default traffic crosses a separate AWG 3+ tunnel to EXIT, while RU traffic leaves through ENTRY WAN or SOAX/SOCKS5.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.28"/></filter>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M 0 0 L 12 6 L 0 12 z" fill="#58a6ff"/></marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M 0 0 L 12 6 L 0 12 z" fill="#f0a33b"/></marker>
  </defs>

  <rect width="1440" height="620" rx="24" fill="#0d1117"/>
  <rect x="1" y="1" width="1438" height="618" rx="23" fill="none" stroke="#30363d" stroke-width="2"/>
  <text x="48" y="54" fill="#f0f6fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">KalimeraWG · traffic routing</text>
  <text x="48" y="84" fill="#8b949e" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Client and inter-server tunnels remain separate</text>

  <path d="M 260 295 H 350" fill="none" stroke="#58a6ff" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <path d="M 570 260 C 620 260 620 135 660 135" fill="none" stroke="#58a6ff" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <path d="M 920 135 H 1030" fill="none" stroke="#58a6ff" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <path d="M 1200 135 H 1280" fill="none" stroke="#58a6ff" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <path d="M 570 320 C 620 320 620 450 660 450" fill="none" stroke="#f0a33b" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <path d="M 920 430 C 970 430 980 395 1040 395" fill="none" stroke="#f0a33b" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <path d="M 920 470 C 970 470 980 515 1040 515" fill="none" stroke="#f0a33b" stroke-width="4" marker-end="url(#arrow-orange)"/>

  <g filter="url(#shadow)">
    <rect x="50" y="240" width="210" height="110" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="3"/>
    <text x="155" y="287" text-anchor="middle" fill="#f0f6fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">VPN client</text>
    <text x="155" y="320" text-anchor="middle" fill="#8b949e" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">AmneziaWG</text>
    <rect x="350" y="220" width="220" height="150" rx="14" fill="#211a36" stroke="#a371f7" stroke-width="3"/>
    <text x="460" y="270" text-anchor="middle" fill="#f0f6fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">ENTRY</text>
    <text x="460" y="307" text-anchor="middle" fill="#d2a8ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">clients · UDP/443</text>
    <text x="460" y="337" text-anchor="middle" fill="#d2a8ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">mobile · UDP/8443</text>
    <rect x="660" y="75" width="260" height="120" rx="14" fill="#13243a" stroke="#58a6ff" stroke-width="3"/>
    <text x="790" y="125" text-anchor="middle" fill="#f0f6fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">AWG 3+ transit</text>
    <text x="790" y="160" text-anchor="middle" fill="#79c0ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">separate tunnel · auto MTU</text>
    <rect x="1030" y="90" width="170" height="90" rx="14" fill="#173523" stroke="#3fb950" stroke-width="3"/>
    <text x="1115" y="127" text-anchor="middle" fill="#f0f6fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700">EXIT</text>
    <text x="1115" y="155" text-anchor="middle" fill="#7ee787" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">primary egress</text>
    <rect x="1280" y="90" width="120" height="90" rx="14" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
    <text x="1340" y="143" text-anchor="middle" fill="#f0f6fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Internet</text>
    <rect x="660" y="390" width="260" height="120" rx="14" fill="#382614" stroke="#f0a33b" stroke-width="3"/>
    <text x="790" y="440" text-anchor="middle" fill="#f0f6fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700">RU policy</text>
    <text x="790" y="475" text-anchor="middle" fill="#f2cc8f" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">domains · networks · ports</text>
    <rect x="1040" y="350" width="250" height="90" rx="14" fill="#20252b" stroke="#8b949e" stroke-width="2"/>
    <text x="1165" y="387" text-anchor="middle" fill="#f0f6fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">ENTRY WAN</text>
    <text x="1165" y="416" text-anchor="middle" fill="#b1bac4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">direct egress</text>
    <rect x="1040" y="470" width="250" height="90" rx="14" fill="#182b27" stroke="#56d4b3" stroke-width="2"/>
    <text x="1165" y="507" text-anchor="middle" fill="#f0f6fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">SOAX / SOCKS5</text>
    <text x="1165" y="536" text-anchor="middle" fill="#7ee7ce" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">TUN · fail-open</text>
  </g>

  <rect x="585" y="206" width="150" height="32" rx="16" fill="#13243a"/>
  <text x="660" y="228" text-anchor="middle" fill="#79c0ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">DEFAULT TRAFFIC</text>
  <rect x="590" y="348" width="140" height="32" rx="16" fill="#382614"/>
  <text x="660" y="370" text-anchor="middle" fill="#f2cc8f" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">RU TRAFFIC</text>
</svg>
