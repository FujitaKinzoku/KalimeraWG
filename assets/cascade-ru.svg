<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="title desc">
  <title id="title">Маршрутизация KalimeraWG</title>
  <desc id="desc">Три компактных модуля показывают подключение клиента, основной маршрут через EXIT и отдельную политику российского трафика.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    .title { fill: #f0f6fc; font-size: 25px; font-weight: 600; }
    .section { fill: #8b949e; font-size: 17px; font-weight: 600; letter-spacing: .4px; }
    .label { fill: #f0f6fc; font-size: 20px; font-weight: 600; }
    .detail { fill: #8b949e; font-size: 16px; }
    .arrow { fill: #8b949e; font-size: 25px; }
    .node { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
    .core { fill: #172536; stroke: #58a6ff; stroke-width: 2; }
    .route { fill: #2a2118; stroke: #d29922; stroke-width: 2; }
    .exit { fill: #17251c; stroke: #3fb950; stroke-width: 2; }
    .module { fill: none; stroke: #30363d; stroke-width: 1; }
    .divider { stroke: #30363d; stroke-width: 1; }
  </style>

  <rect width="760" height="650" rx="16" fill="#0d1117"/>
  <text x="30" y="42" class="title">KalimeraWG · маршрут трафика</text>
  <text x="730" y="42" text-anchor="end" class="detail">три независимых этапа</text>

  <rect x="24" y="66" width="712" height="142" rx="10" class="module"/>
  <text x="44" y="95" class="section">1. ПОДКЛЮЧЕНИЕ</text>
  <rect x="44" y="114" width="250" height="70" rx="7" class="node"/>
  <text x="169" y="143" text-anchor="middle" class="label">VPN-клиент</text>
  <text x="169" y="168" text-anchor="middle" class="detail">AWG · UDP/443 или 8443</text>
  <text x="328" y="157" text-anchor="middle" class="arrow">→</text>
  <rect x="362" y="114" width="250" height="70" rx="7" class="core"/>
  <text x="487" y="143" text-anchor="middle" class="label">ENTRY</text>
  <text x="487" y="168" text-anchor="middle" class="detail">DNS и маршрутизация</text>

  <rect x="24" y="222" width="712" height="158" rx="10" class="module"/>
  <text x="44" y="251" class="section">2. ОСНОВНОЙ МАРШРУТ</text>
  <rect x="44" y="270" width="138" height="78" rx="7" class="core"/>
  <text x="113" y="316" text-anchor="middle" class="label">ENTRY</text>
  <text x="203" y="318" text-anchor="middle" class="arrow">→</text>
  <rect x="224" y="270" width="158" height="78" rx="7" class="node"/>
  <text x="303" y="302" text-anchor="middle" class="label">AWG 3+</text>
  <text x="303" y="327" text-anchor="middle" class="detail">отдельный канал</text>
  <text x="403" y="318" text-anchor="middle" class="arrow">→</text>
  <rect x="424" y="270" width="128" height="78" rx="7" class="exit"/>
  <text x="488" y="316" text-anchor="middle" class="label">EXIT</text>
  <text x="573" y="318" text-anchor="middle" class="arrow">→</text>
  <rect x="594" y="270" width="122" height="78" rx="7" class="node"/>
  <text x="655" y="316" text-anchor="middle" class="label">Интернет</text>

  <rect x="24" y="394" width="712" height="202" rx="10" class="module"/>
  <text x="44" y="423" class="section">3. RU-ПОЛИТИКА</text>
  <rect x="44" y="442" width="138" height="78" rx="7" class="core"/>
  <text x="113" y="488" text-anchor="middle" class="label">ENTRY</text>
  <text x="203" y="490" text-anchor="middle" class="arrow">→</text>
  <rect x="224" y="442" width="178" height="78" rx="7" class="route"/>
  <text x="313" y="474" text-anchor="middle" class="label">RU-трафик</text>
  <text x="313" y="499" text-anchor="middle" class="detail">домены · сети · порты</text>
  <text x="423" y="490" text-anchor="middle" class="arrow">→</text>
  <rect x="444" y="432" width="252" height="50" rx="7" class="node"/>
  <text x="570" y="464" text-anchor="middle" class="label">SOCKS5 / TUN</text>
  <text x="570" y="507" text-anchor="middle" class="detail">или</text>
  <rect x="444" y="526" width="252" height="50" rx="7" class="node"/>
  <text x="570" y="558" text-anchor="middle" class="label">WAN ENTRY · fail-open</text>

  <line x1="30" y1="618" x2="730" y2="618" class="divider"/>
  <text x="380" y="640" text-anchor="middle" class="detail">Клиентский и межсерверный туннели используют разные интерфейсы и ключи</text>
</svg>
