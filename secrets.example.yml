---
# Только пример структуры. Никогда не помещайте сюда реальные значения.
# Создайте зашифрованный inventory/production/group_vars/all/vault.yml.

vault_awg_entry_private_key: "REPLACE_ONLY_INSIDE_ENCRYPTED_VAULT"
vault_awg_entry_legacy_private_key: "REPLACE_ONLY_INSIDE_ENCRYPTED_VAULT"
vault_awg_entry_exit_private_key: "REPLACE_ONLY_INSIDE_ENCRYPTED_VAULT"
vault_awg_entry_exit_peer_public_key: "REPLACE_ONLY_INSIDE_ENCRYPTED_VAULT"
vault_awg_entry_exit_entry_public_key: "REPLACE_ONLY_INSIDE_ENCRYPTED_VAULT"
vault_awg_exit_private_key: "REPLACE_ONLY_INSIDE_ENCRYPTED_VAULT"
vault_awg_entry_exit_psk: "REPLACE_ONLY_INSIDE_ENCRYPTED_VAULT"
vault_awg3_header_protection_key: "REPLACE_ONLY_INSIDE_ENCRYPTED_VAULT"
vault_proxy_username: "REPLACE_ONLY_INSIDE_ENCRYPTED_VAULT_OR_EMPTY"
vault_proxy_password: "REPLACE_ONLY_INSIDE_ENCRYPTED_VAULT_OR_EMPTY"
vault_telegram_bot_token: "REPLACE_ONLY_INSIDE_ENCRYPTED_VAULT"
vault_telegram_chat_id: "REPLACE_ONLY_INSIDE_ENCRYPTED_VAULT"

# Публичные ключи пиров не являются закрытыми ключами, но проект считает их
# чувствительными метаданными inventory и по умолчанию хранит зашифрованными.
vault_entry_peer_public_keys: []
vault_entry_client_peers:
  - name: "REPLACE_WITH_NON_SECRET_LABEL"
    public_key: "REPLACE_ONLY_INSIDE_ENCRYPTED_VAULT"
    allowed_ips:
      - 10.66.0.2/32
    preshared_key: "REPLACE_ONLY_INSIDE_ENCRYPTED_VAULT"
vault_entry_legacy_client_peers: []
vault_exit_peers:
  - name: "REPLACE_WITH_NON_SECRET_LABEL"
    public_key: "REPLACE_ONLY_INSIDE_ENCRYPTED_VAULT"
    allowed_ips:
      - 10.77.0.2/32
    preshared_key: "REPLACE_ONLY_INSIDE_ENCRYPTED_VAULT"
