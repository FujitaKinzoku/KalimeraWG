---
all:
  children:
    entry:
      hosts:
        entry.example.invalid:
          ansible_host: 192.0.2.10
          # Внешний IPv4 ENTRY для cascade-check: нужен, если ansible_host локальный
          # (например, 127.0.0.1 при управлении ENTRY с самого себя).
          cascade_check_entry_source_ipv4: 192.0.2.10
    exit:
      hosts:
        exit.example.invalid:
          ansible_host: 192.0.2.20
