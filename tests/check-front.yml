---
- name: Проверка конфигурации FRONT-релея закреплённой версией Xray-core
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    front_test_root: /tmp/awg-front-validation

  tasks:
    - name: Загрузка безопасных примерных переменных FRONT
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/front/defaults/main.yml"

    # include_vars имеет более высокий приоритет, чем vars: на уровне
    # отдельной задачи (та же ловушка, что уже чинили в check-sing-box.yml
    # для reality_fallback_enabled) - front_origin_domain из defaults пустой,
    # и любой последующий vars: front_origin_domain: ... в задачах ниже
    # молча игнорировался бы. set_fact стоит выше include_vars и переопределяет
    # его для всех последующих задач без необходимости повторять в каждой.
    - name: Установка тестовых значений FRONT, переопределяющих defaults
      ansible.builtin.set_fact:
        front_origin_domain: origin.example.invalid
        front_origin_cert_path: "{{ front_test_root_path }}/fake-fullchain.pem"
        front_origin_key_path: "{{ front_test_root_path }}/fake-privkey.pem"
      vars:
        front_test_root_path: /tmp/awg-front-validation

    - name: Проверка закреплённого артефакта и конфигурации Xray-core
      block:
        - name: Создание изолированного каталога проверки FRONT
          ansible.builtin.file:
            path: "{{ front_test_root }}"
            state: directory
            mode: "0700"

        - name: Загрузка официального релиза Xray-core с проверкой checksum
          ansible.builtin.get_url:
            url: "{{ front_xray_packages[ansible_architecture].url }}"
            dest: "{{ front_test_root }}/xray.zip"
            checksum: "{{ front_xray_packages[ansible_architecture].checksum }}"
            mode: "0600"

        - name: Распаковка релиза Xray-core
          ansible.builtin.command:
            argv:
              - python3
              - -m
              - zipfile
              - -e
              - "{{ front_test_root }}/xray.zip"
              - "{{ front_test_root }}"
          changed_when: false

        - name: Права на исполнение бинарника Xray-core
          ansible.builtin.file:
            path: "{{ front_test_root }}/xray"
            mode: "0755"

        # Тестовые REALITY-факты ENTRY генерируются закреплённым sing-box, а не
        # хранятся в репозитории литералом - та же практика, что в
        # tests/check-sing-box.yml, без ложных срабатываний check-secrets.sh.
        - name: "Проверка: генерация тестовой ключевой пары REALITY (ENTRY)"
          ansible.builtin.command:
            argv:
              - "{{ front_test_root }}/xray"
              - uuid
          register: front_test_entry_client_uuid
          changed_when: false
          no_log: true

        - name: "Проверка: генерация второго тестового uuid (front-relay ENTRY)"
          ansible.builtin.command:
            argv:
              - "{{ front_test_root }}/xray"
              - uuid
          register: front_test_entry_front_uuid
          changed_when: false
          no_log: true

        - name: "Проверка: генерация тестовой пары X25519 (заглушка REALITY publicKey/shortId)"
          ansible.builtin.command:
            argv:
              - "{{ front_test_root }}/xray"
              - x25519
          register: front_test_entry_keypair
          changed_when: false
          no_log: true

        # Вывод "xray x25519" в v26 - "Password (PublicKey): <значение>" (в
        # более старых версиях был просто "Public key:") - regex без якоря
        # на конкретную скобочную часть устойчив к обоим вариантам метки.
        - name: "Проверка: разбор тестового материала ENTRY"
          ansible.builtin.set_fact:
            front_test_entry_public_key: >-
              {{ front_test_entry_keypair.stdout
                 | regex_search('Password[^:]*:\s*(\S+)', '\1')
                 | first }}
          no_log: true

        # xray vlessenc всегда выводит обе пары (X25519 и ML-KEM-768) без
        # флага выбора - тот же разбор по якорной строке, что и в
        # roles/front/tasks/main.yml.
        - name: "Проверка: генерация тестовой пары VLESS Encryption"
          ansible.builtin.command:
            argv:
              - "{{ front_test_root }}/xray"
              - vlessenc
          register: front_test_vlessenc
          changed_when: false
          no_log: true

        - name: "Проверка: разбор тестовой пары VLESS Encryption (ML-KEM-768)"
          ansible.builtin.set_fact:
            front_test_vless_decryption: >-
              {{ front_test_vlessenc.stdout
                 | regex_search('ML-KEM-768[\s\S]*?"decryption": "([^"]+)"', '\1')
                 | first }}
            front_test_vless_encryption: >-
              {{ front_test_vlessenc.stdout
                 | regex_search('ML-KEM-768[\s\S]*?"encryption": "([^"]+)"', '\1')
                 | first }}
          no_log: true

        # front_entry_* - простые факты (не groups/hostvars, это служебные
        # переменные Ansible, их нельзя подменить через vars: в задаче) -
        # тот же набор, что roles/front/tasks/main.yml вычисляет один раз
        # через set_fact из hostvars ENTRY перед рендерингом обоих шаблонов.
        #
        # Проверяются ВСЕ комбинации, которые допускает assert роли, а не
        # только значения по умолчанию: роль разрешает переключать
        # front_xhttp_mode и front_reality_flow через inventory, и
        # недопустимое сочетание должно падать здесь, а не на живом сервере.
        - name: Проверка конфигурации Xray-core во всех допустимых режимах
          ansible.builtin.include_tasks: tasks/render-front-xray-fixture.yml
          loop: >-
            {{ ['packet-up', 'stream-up', 'stream-one', 'auto']
               | product(['xtls-rprx-vision-udp443', 'xtls-rprx-vision'], [false, true], [false, true])
               | list }}
          loop_control:
            loop_var: front_case
            label: "{{ front_case.0 }}/{{ front_case.1 }}/enc={{ front_case.2 }}/dis={{ front_case.3 }}"

        - name: Установка параметров проверки управления VLESS-пользователями
          ansible.builtin.set_fact:
            front_xray_binary_path: "{{ front_test_root }}/xray"
            front_xray_state_dir: "{{ front_test_root }}/state"
            front_xray_base_config_path: "{{ front_test_root }}/state/config.base.json"
            front_xray_config_path: "{{ front_test_root }}/state/config.json"
            front_vless_users_path: "{{ front_test_root }}/state/users.json"
            front_vless_client_settings_path: "{{ front_test_root }}/state/client-settings.json"
            front_vless_user_command_path: "{{ front_test_root }}/vless-user"
            front_vless_export_dir: "{{ front_test_root }}/exports"
            security_admin_user: root
            front_xray_user: root
            front_xray_group: root
            front_xray_service_name: xray-validation.service
            front_systemctl_path: "{{ front_test_root }}/systemctl"
            runtime_secrets_ctl_path: "{{ front_test_root }}/missing-secretctl"
            front_access_modes: [direct, cdn]
            front_direct_domain: origin.example.invalid
            front_cdn_domain: edge.example.invalid
            front_xhttp_mode: packet-up
            front_xhttp_path: /verified-allowlist-path
            front_xhttp_disguise_enabled: true
            front_vless_encryption_enabled: true
            front_vless_decryption: "{{ front_test_vless_decryption }}"
            front_vless_encryption: "{{ front_test_vless_encryption }}"
            front_vless_initial_user_name: initial
            front_entry_address: 198.51.100.10
            front_entry_reality_port: 443
            front_entry_reality_dest: yandex.ru
            front_entry_reality_client_uuid: "{{ front_test_entry_client_uuid.stdout | trim }}"
            front_entry_reality_front_client_uuid: "{{ front_test_entry_front_uuid.stdout | trim }}"
            front_entry_reality_public_key: "{{ front_test_entry_public_key }}"
            front_entry_reality_short_id: "0011223344556677"

        - name: Создание каталога проверки VLESS-пользователей
          ansible.builtin.file:
            path: "{{ front_xray_state_dir }}"
            state: directory
            mode: "0700"

        - name: Формирование изолированного systemctl для проверки менеджера
          ansible.builtin.copy:
            dest: "{{ front_systemctl_path }}"
            mode: "0750"
            content: |
              #!/usr/bin/env sh
              set -eu
              printf '%s\n' "$*" >>{{ front_test_root }}/systemctl.log

        - name: Рендер файлов управления VLESS-пользователями
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../roles/front/templates/{{ item.src }}"
            dest: "{{ item.dest }}"
            mode: "{{ item.mode }}"
          loop:
            - {src: xray-config.json.j2, dest: "{{ front_xray_base_config_path }}", mode: "0600"}
            - {src: vless-client-settings.json.j2, dest: "{{ front_vless_client_settings_path }}", mode: "0600"}
            - {src: vless-users.json.j2, dest: "{{ front_vless_users_path }}", mode: "0600"}
            - {src: vless-user.py.j2, dest: "{{ front_vless_user_command_path }}", mode: "0750"}
          no_log: true

        - name: Синхронизация тестового реестра VLESS-пользователей
          ansible.builtin.command:
            argv: ["{{ front_vless_user_command_path }}", sync, --no-restart]
          register: front_test_vless_sync
          changed_when: false

        - name: Экспорт тестового CDN JSON
          ansible.builtin.command:
            argv: ["{{ front_vless_user_command_path }}", export, initial]
          register: front_test_vless_export
          changed_when: false
          no_log: true

        - name: Семантическая проверка клиентского CDN JSON закреплённым Xray-core
          ansible.builtin.command:
            argv:
              - "{{ front_xray_binary_path }}"
              - run
              - -test
              - -c
              - "{{ front_vless_export_dir }}/initial.json"
          changed_when: false
          no_log: true

        - name: Чтение исходной активной конфигурации Xray
          ansible.builtin.slurp:
            src: "{{ front_xray_config_path }}"
          register: front_test_active_initial
          no_log: true

        - name: Проверка экспортированного CDN JSON и активной конфигурации
          ansible.builtin.assert:
            quiet: true
            that:
              - (front_test_vless_export.stdout | from_json).outbounds[0].settings.vnext[0].address == 'edge.example.invalid'
              - (front_test_vless_export.stdout | from_json).dns.queryStrategy == 'UseIP'
              - (front_test_vless_export.stdout | from_json).dns.servers == ['77.88.8.8', '77.88.8.1']
              - (front_test_vless_export.stdout | from_json).inbounds | length == 2
              - (front_test_vless_export.stdout | from_json).inbounds[0].protocol == 'socks'
              - (front_test_vless_export.stdout | from_json).inbounds[0].settings.auth == 'noauth'
              - (front_test_vless_export.stdout | from_json).inbounds[0].settings.udp
              - (front_test_vless_export.stdout | from_json).inbounds[0].tag == 'socks-in'
              - (front_test_vless_export.stdout | from_json).inbounds[1].protocol == 'http'
              - (front_test_vless_export.stdout | from_json).inbounds[1].port == 10809
              - (front_test_vless_export.stdout | from_json).inbounds[1].tag == 'http-in'
              - (front_test_vless_export.stdout | from_json).outbounds[0].streamSettings.network == 'xhttp'
              - (front_test_vless_export.stdout | from_json).outbounds[0].settings.vnext[0].users[0].flow == ''
              - (front_test_vless_export.stdout | from_json).outbounds[0].streamSettings.tlsSettings.alpn == ['h2', 'http/1.1']
              - (front_test_vless_export.stdout | from_json).outbounds[0].streamSettings.tlsSettings.fingerprint == 'firefox'
              - (front_test_vless_export.stdout | from_json).outbounds[0].streamSettings.tlsSettings.serverName == 'edge.example.invalid'
              - (front_test_vless_export.stdout | from_json).outbounds[0].streamSettings.xhttpSettings.mode == 'packet-up'
              - (front_test_vless_export.stdout | from_json).outbounds[0].streamSettings.xhttpSettings.uplinkHTTPMethod == 'GET'
              - (front_test_vless_export.stdout | from_json).outbounds[0].streamSettings.xhttpSettings.host == 'edge.example.invalid'
              - (front_test_vless_export.stdout | from_json).outbounds[0].streamSettings.xhttpSettings.extra.path == '/verified-allowlist-path'
              - (front_test_vless_export.stdout | from_json).outbounds[0].streamSettings.xhttpSettings.extra.sessionIDKey == 'PHPESSID'
              - (front_test_vless_export.stdout | from_json).outbounds[0].streamSettings.xhttpSettings.extra.sessionKey == 'PHPESSID'
              - (front_test_vless_export.stdout | from_json).outbounds[0].streamSettings.xhttpSettings.extra.xmux.hKeepAlivePeriod == 30
              - (front_test_vless_export.stdout | from_json).outbounds[1].tag == 'direct'
              - (front_test_vless_export.stdout | from_json).outbounds[2].tag == 'block'
              - (front_test_vless_export.stdout | from_json).routing.rules[0].outboundTag == 'proxy'
              - (front_test_vless_export.stdout | from_json).remarks == 'Kalimera-FRONT-disguiseV2'
              - (front_test_active_initial.content | b64decode | from_json).inbounds[0].settings.clients | length == 1
            fail_msg: >-
              Экспортированный CDN JSON или активный список VLESS-пользователей
              не соответствует проверяемому профилю

        - name: Создание тестового CDN-пользователя
          ansible.builtin.command:
            argv: ["{{ front_vless_user_command_path }}", create, test-cdn, cdn]
          register: front_test_vless_create
          changed_when: true
          no_log: true

        - name: Чтение активной конфигурации после создания пользователя
          ansible.builtin.slurp:
            src: "{{ front_xray_config_path }}"
          register: front_test_active_created
          no_log: true

        - name: Проверка JSON нового пользователя и двух активных UUID
          ansible.builtin.assert:
            quiet: true
            that:
              - (front_test_vless_create.stdout | from_json).outbounds[0].settings.vnext[0].address == 'edge.example.invalid'
              - (front_test_active_created.content | b64decode | from_json).inbounds[0].settings.clients | length == 2
          no_log: true

        - name: Проверка защищённого файла JSON нового пользователя
          ansible.builtin.stat:
            path: "{{ front_vless_export_dir }}/test-cdn.json"
          register: front_test_vless_export_file

        - name: Подтверждение прав защищённого файла JSON
          ansible.builtin.assert:
            quiet: true
            that:
              - front_test_vless_export_file.stat.isreg | default(false)
              - front_test_vless_export_file.stat.mode == '0600'
              - front_test_vless_export_file.stat.pw_name == 'root'
              - "('Файл JSON сохранён: ' ~ front_vless_export_dir ~ '/test-cdn.json') in front_test_vless_create.stderr"
              - "('Открыть конфигурацию: nano ' ~ front_vless_export_dir ~ '/test-cdn.json') in front_test_vless_create.stderr"

        - name: Удаление тестового CDN-пользователя
          ansible.builtin.command:
            argv: ["{{ front_vless_user_command_path }}", delete, test-cdn, --yes]
          changed_when: true
          no_log: true

        - name: Чтение итоговой конфигурации и журнала тестового systemctl
          ansible.builtin.slurp:
            src: "{{ item }}"
          loop:
            - "{{ front_xray_config_path }}"
            - "{{ front_test_root }}/systemctl.log"
          register: front_test_final_files
          no_log: true

        - name: Проверка удаления временного JSON отозванного пользователя
          ansible.builtin.stat:
            path: "{{ front_vless_export_dir }}/test-cdn.json"
          register: front_test_vless_deleted_export

        - name: Подтверждение удаления временного JSON
          ansible.builtin.assert:
            quiet: true
            that:
              - not (front_test_vless_deleted_export.stat.exists | default(false))

        - name: Проверка возврата к исходному пользователю
          ansible.builtin.assert:
            quiet: true
            that:
              - (front_test_final_files.results[0].content | b64decode | from_json).inbounds[0].settings.clients | length == 1
              - (front_test_final_files.results[1].content | b64decode).splitlines() | length == 2
          no_log: true

        # front_origin_domain/front_origin_cert_path/front_origin_key_path
        # приходят из set_fact выше. Подписка намеренно отсутствует в модели.
        - name: Рендер тестовой конфигурации Nginx FRONT с TLS-блоком
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../roles/front/templates/nginx-front.conf.j2"
            dest: "{{ front_test_root }}/nginx-front.conf"
            mode: "0644"
          vars:
            front_cert_present: true
            front_xhttp_listen_port: 8080
            front_xhttp_path: /api/stream
            front_subscription_enabled: false

        - name: Генерация одноразового самоподписанного сертификата для проверки синтаксиса
          ansible.builtin.command:
            argv:
              - openssl
              - req
              - -x509
              - -newkey
              - rsa:2048
              - -keyout
              - "{{ front_test_root }}/fake-privkey.pem"
              - -out
              - "{{ front_test_root }}/fake-fullchain.pem"
              - -days
              - "1"
              - -nodes
              - -subj
              - /CN=origin.example.invalid
          changed_when: false

        # roles/front/templates/nginx-front.conf.j2 рендерит только фрагмент
        # server{} (в реальном деплое подключается через sites-enabled внутри
        # системного http{} из /etc/nginx/nginx.conf) - nginx -t -c ожидает
        # ПОЛНЫЙ конфиг с events{}/http{}, поэтому для проверки синтаксиса
        # оборачиваем фрагмент через include в минимальный конфиг-обёртку.
        - name: Формирование конфига-обёртки для проверки синтаксиса Nginx
          ansible.builtin.copy:
            dest: "{{ front_test_root }}/nginx-wrapper.conf"
            content: |
              events {}
              http {
                  include {{ front_test_root }}/nginx-front.conf;
              }
            mode: "0644"

        - name: Проверка наличия Nginx в окружении
          ansible.builtin.stat:
            path: /usr/sbin/nginx
          register: front_test_nginx_binary

        - name: Проверка синтаксиса Nginx, если бинарник доступен в CI
          ansible.builtin.command:
            argv:
              - /usr/sbin/nginx
              - -t
              - -c
              - "{{ front_test_root }}/nginx-wrapper.conf"
          register: front_test_nginx_syntax
          changed_when: false
          when: front_test_nginx_binary.stat.executable | default(false)

        - name: Отчёт о проверке синтаксиса Nginx
          ansible.builtin.debug:
            msg: >-
              {{ 'nginx недоступен в этом окружении - синтаксис не проверен'
                 if not (front_test_nginx_binary.stat.executable | default(false))
                 else front_test_nginx_syntax.stderr }}

        - name: Проверка отсутствия синтаксических ошибок Nginx (если бинарник был доступен)
          ansible.builtin.assert:
            quiet: true
            that:
              - front_test_nginx_syntax.rc == 0
            fail_msg: "roles/front/templates/nginx-front.conf.j2 рендерит невалидный конфиг Nginx"
          when: front_test_nginx_binary.stat.executable | default(false)

      always:
        - name: Удаление изолированного каталога проверки FRONT
          ansible.builtin.file:
            path: "{{ front_test_root }}"
            state: absent
          changed_when: false
