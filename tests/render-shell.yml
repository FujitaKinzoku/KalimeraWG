---
- name: Формирование управляемых shell-шаблонов и запуск ShellCheck
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    rendered_shell_root: /tmp/awg-rendered-shell
    awg3_transit_address: 10.77.0.2/32
    awg3_transit_effective_mtu: 1356
    awg3_transit_obfuscation:
      s4: 24

  tasks:
    - name: Загрузка безопасных общих примерных переменных
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../inventory/example/group_vars/all/main.yml"

    - name: Загрузка безопасных примерных переменных ENTRY
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../inventory/example/group_vars/entry.yml"

    - name: Загрузка defaults ролей для исполняемых шаблонов
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../{{ item }}"
      loop:
        - roles/common/defaults/main.yml
        - roles/terminal/defaults/main.yml
        - roles/entry/defaults/main.yml
        - roles/entry_routing/defaults/main.yml
        - roles/entry_dns/defaults/main.yml
        - roles/entry_watchdog/defaults/main.yml
        - roles/sing_box/defaults/main.yml
        - roles/health/defaults/main.yml
        - roles/operations/defaults/main.yml
        - roles/awg3_transit/defaults/main.yml
        - roles/runtime_secrets/defaults/main.yml
        - roles/security/defaults/main.yml

    - name: Включение preview-ветвей логики для проверки шаблонов
      ansible.builtin.set_fact:
        entry_legacy_client_available: true
        entry_legacy_client_enabled: false
        entry_mobile_client_available: true
        entry_mobile_client_enabled: false
        awg3_transit_enabled: true
        reality_fallback_enabled: true
        runtime_secrets_enabled: true
        security_manage_admin_account: true
        security_finalize_admin_access: true
        security_admin_user: kalimera
        security_root_authorized_keys_path: "{{ rendered_shell_root }}/root-authorized_keys"
        security_ssh_host_key_paths:
          - "{{ rendered_shell_root }}/ssh_host_ed25519_key"
        runtime_secrets_cluster_id: "00000000000000000000000000000000"
        runtime_secrets_peer_inventory_hosts:
          - exit.example.invalid
        vault_runtime_secret_key_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        awg_node_role: entry
        ansible_port: 56777
        terminal_summary_entry_host: 192.0.2.10
        terminal_summary_exit_host: 192.0.2.20
        terminal_summary_front_present: true
        terminal_summary_front_host: 192.0.2.30
        terminal_summary_front_user: kalimera
        terminal_summary_front_ssh_port: 56777
        terminal_summary_front_origin_domain: front.example.invalid
        terminal_summary_front_direct_enabled: true
        terminal_summary_front_cdn_enabled: true
        terminal_summary_front_cdn_state: ready
        terminal_summary_front_cdn_domain: cdn.example.invalid
        terminal_summary_front_backend_port: 8444
        terminal_summary_entry_user: root
        terminal_summary_exit_user: root
        terminal_summary_entry_ssh_port: 56777
        terminal_summary_exit_ssh_port: 56777
        terminal_summary_client_port: 443
        terminal_summary_legacy_port: 39744
        terminal_summary_mobile_port: 8443
        terminal_summary_entry_transit_port: 39745
        terminal_summary_exit_transit_port: 443
        terminal_summary_legacy_available: true
        terminal_summary_mobile_available: true
        terminal_summary_proxy_configured: true
        terminal_summary_entry_client_interface: awg0
        terminal_summary_entry_transit_interface: awg3
        terminal_summary_legacy_interface: awg-old
        terminal_summary_mobile_interface: awg-mobile
        terminal_summary_exit_transit_interface: awg3

    - name: Пересоздание временного каталога шаблонов
      block:
        - name: Создание временного каталога шаблонов
          ansible.builtin.file:
            path: "{{ rendered_shell_root }}"
            state: directory
            mode: "0700"

        - name: Формирование программы порогового runtime-хранилища
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../roles/runtime_secrets/templates/secretctl.py.j2"
            dest: "{{ rendered_shell_root }}/kalimera-secretctl"
            mode: "0700"

        - name: Проверка синтаксиса программы порогового runtime-хранилища
          ansible.builtin.command:
            argv:
              - python3
              - -m
              - py_compile
              - "{{ rendered_shell_root }}/kalimera-secretctl"
          changed_when: false

        - name: Формирование безопасной структуры runtime-хранилища
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../roles/runtime_secrets/templates/config.json.j2"
            dest: "{{ rendered_shell_root }}/runtime-config.json"
            mode: "0600"

        - name: Проверка JSON и полного набора защищаемых путей
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - >-
                import json,sys;
                d=json.load(open(sys.argv[1], encoding='utf-8'));
                paths={m['source'] for m in d['mappings']};
                assert '/etc/awg' in paths and '/etc/sing-box' in paths and
                '/etc/amnezia/amneziawg-v3' in paths and
                '/usr/local/etc/xray' in paths and '/etc/letsencrypt' in paths
              - "{{ rendered_shell_root }}/runtime-config.json"
          changed_when: false

        - name: Формирование ограниченной политики sudo рабочего администратора
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../roles/security/templates/kalimera-admin.sudoers.j2"
            dest: "{{ rendered_shell_root }}/kalimera-admin.sudoers"
            mode: "0440"

        - name: Проверка отсутствия неограниченного passwordless sudo
          ansible.builtin.shell: |
            set -Eeuo pipefail
            sudoers_path={{ (rendered_shell_root ~ '/kalimera-admin.sudoers') | quote }}
            grep -Fq '/usr/local/libexec/kalimera-admin-command *' "$sudoers_path"
            grep -Fq '/usr/local/libexec/kalimera-share-export get-share' "$sudoers_path"
            ! grep -Eq 'NOPASSWD:[[:space:]]+ALL([[:space:]]|$)' "$sudoers_path"
          args:
            executable: /bin/bash
          changed_when: false

        - name: Создание временного Ed25519 host key для проверки SSH
          ansible.builtin.command:
            argv:
              - ssh-keygen
              - -q
              - -t
              - ed25519
              - -N
              - ""
              - -f
              - "{{ rendered_shell_root }}/ssh_host_ed25519_key"
          args:
            creates: "{{ rendered_shell_root }}/ssh_host_ed25519_key"

        - name: Формирование строгой конфигурации SSH
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../roles/security/templates/sshd-awg.conf.j2"
            dest: "{{ rendered_shell_root }}/sshd-awg.conf"
            mode: "0600"

        - name: Подготовка штатного runtime-каталога OpenSSH
          ansible.builtin.file:
            path: /run/sshd
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Проверка синтаксиса и результирующей политики SSH
          ansible.builtin.shell: |
            set -Eeuo pipefail
            config={{ (rendered_shell_root ~ '/sshd-awg.conf') | quote }}
            effective="$(/usr/sbin/sshd -T -f "$config" \
              -C user=kalimera,host=localhost,addr=127.0.0.1)"
            grep -qx 'authenticationmethods publickey' <<<"$effective"
            grep -qx 'authorizedkeysfile .ssh/authorized_keys' <<<"$effective"
            grep -qx 'requiredrsasize 2048' <<<"$effective"
            grep -qx 'disableforwarding yes' <<<"$effective"
            grep -qx 'allowstreamlocalforwarding no' <<<"$effective"
            ! grep -Eq '^pubkeyacceptedalgorithms .*([,[:space:]])ssh-rsa([,[:space:]]|$)' \
              <<<"$effective"
          args:
            executable: /bin/bash
          changed_when: false

        - name: Формирование исполняемых шаблонов ENTRY
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../{{ item.src }}"
            dest: "{{ rendered_shell_root }}/{{ item.dest }}"
            mode: "0700"
          loop:
            - src: roles/entry_routing/templates/awg-entry-routing.sh.j2
              dest: awg-entry-routing
            - src: roles/entry_routing/templates/awg-entry-routing-reconcile.sh.j2
              dest: awg-entry-routing-reconcile
            - src: roles/entry_routing/templates/awg-ru-zone-update.sh.j2
              dest: awg-ru-zone-update
            - src: roles/entry_watchdog/templates/awg-ru-proxy-watch.sh.j2
              dest: awg-ru-proxy-watch
            - src: roles/operations/templates/server-audit.sh.j2
              dest: server-audit-entry
            - src: roles/operations/templates/awg-managed-integrity.sh.j2
              dest: awg-managed-integrity-entry
            - src: roles/operations/templates/telegram-monitor.sh.j2
              dest: telegram-monitor-entry
            - src: roles/operations/templates/awg-kernel-guard.sh.j2
              dest: awg-kernel-guard
            - src: roles/security/templates/kalimera-admin-command.sh.j2
              dest: kalimera-admin-command
            - src: roles/runtime_secrets/templates/share-export.sh.j2
              dest: kalimera-share-export
            - src: roles/operations/templates/maintenance.sh.j2
              dest: maintenance
            - src: roles/operations/templates/update-all.sh.j2
              dest: update-all
            - src: roles/operations/templates/f2b-reset.sh.j2
              dest: f2b-reset
            - src: roles/operations/templates/ssh-key-audit.sh.j2
              dest: ssh-key-audit
            - src: roles/operations/templates/domain-admin.sh.j2
              dest: domain-admin
            - src: roles/operations/templates/ru-proxy.sh.j2
              dest: ru-proxy
            - src: roles/operations/templates/ru-proxy-set.sh.j2
              dest: ru-proxy-set
            - src: roles/operations/templates/dot-switch.sh.j2
              dest: dot-switch
            - src: roles/operations/templates/doh-switch.sh.j2
              dest: doh-switch
            - src: roles/operations/templates/reality-dest-switch.sh.j2
              dest: reality-dest-switch
            - src: roles/operations/templates/dns-status.sh.j2
              dest: dns-status
            - src: roles/operations/templates/ru-direct-ports.sh.j2
              dest: ru-direct-ports
            - src: roles/operations/templates/vpn-user.sh.j2
              dest: vpn-user
            - src: roles/operations/templates/awg-old.sh.j2
              dest: awg-old
            - src: roles/operations/templates/awg-mobile.sh.j2
              dest: awg-mobile
            - src: roles/entry/templates/awg-mobile-firewall.sh.j2
              dest: awg-mobile-firewall
            - src: roles/operations/templates/awg-local-peer-apply.sh.j2
              dest: awg-local-peer-apply
            - src: roles/operations/templates/awg-dns-policy.sh.j2
              dest: awg-dns-policy
            - src: roles/awg3_transit/templates/transit-setup.sh.j2
              dest: awg3-transit-setup
            - src: roles/awg3_transit/templates/transit-restart.sh.j2
              dest: awg3-transit-restart
            - src: roles/awg3_transit/templates/validate-config.sh.j2
              dest: awg3-validate-config
            - src: roles/runtime_secrets/templates/unlock-runtime.sh.j2
              dest: kalimera-secrets-unlock
            - src: roles/front/templates/certbot-deploy-hook.sh.j2
              dest: certbot-deploy-hook

        - name: Формирование настроек интерактивного терминала
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../{{ item.src }}"
            dest: "{{ rendered_shell_root }}/{{ item.dest }}"
            mode: "0600"
          loop:
            - src: roles/terminal/templates/kalimera-prompt.sh.j2
              dest: kalimera-prompt
            - src: roles/terminal/templates/kalimera-shell-tools.sh.j2
              dest: kalimera-shell-tools
            - src: roles/terminal/templates/kalimera-help.sh.j2
              dest: kalimera-help
            - src: roles/terminal/templates/kalimera-test.sh.j2
              dest: kalimera-test
            - src: roles/terminal/templates/kalimera-status.py.j2
              dest: kalimera-status
            - src: roles/terminal/templates/kalimera-blesh-init.sh.j2
              dest: kalimera-blesh-init
            - src: roles/terminal/templates/blesh.sh.j2
              dest: blesh-loader

        - name: Проверка синтаксиса настроек интерактивного терминала
          ansible.builtin.command:
            argv:
              - bash
              - -n
              - "{{ rendered_shell_root }}/{{ item }}"
          loop:
            - kalimera-prompt
            - kalimera-shell-tools
            - kalimera-help
            - kalimera-test
            - kalimera-blesh-init
            - blesh-loader
          changed_when: false

        - name: Проверка синтаксиса сводки текущей конфигурации
          ansible.builtin.command:
            argv:
              - python3
              - -m
              - py_compile
              - "{{ rendered_shell_root }}/kalimera-status"
          changed_when: false

        - name: Исполняемая проверка сводки и табличной справки
          ansible.builtin.command:
            argv:
              - python3
              - "{{ rendered_shell_root }}/kalimera-status"
              - --with-commands
          environment:
            NO_COLOR: "1"
          register: rendered_kalimera_status
          changed_when: false
          failed_when: >-
            rendered_kalimera_status.rc != 0 or
            'ПОДКЛЮЧЕНИЯ' not in rendered_kalimera_status.stdout or
            'СХЕМА РАБОТЫ И DNS' not in rendered_kalimera_status.stdout or
            'АВТОМАТИЧЕСКИ СОГЛАСОВАННЫЙ MTU' not in rendered_kalimera_status.stdout or
            'ЗАЩИТА ВНЕШНИХ ИНТЕРФЕЙСОВ' not in rendered_kalimera_status.stdout or
            'No-logs' not in rendered_kalimera_status.stdout or
            'СОСТОЯНИЕ И ОБСЛУЖИВАНИЕ' not in rendered_kalimera_status.stdout or
            'VPN-КЛИЕНТЫ' not in rendered_kalimera_status.stdout

        - name: Проверка синтаксиса программы возможностей SOCKS5
          ansible.builtin.command:
            argv:
              - python3
              - -m
              - py_compile
              - "{{ playbook_dir }}/../roles/operations/files/ru-proxy-capability.py"
          changed_when: false

        - name: Исполняемая проверка обнаружения постороннего root SSH-ключа
          ansible.builtin.shell: |
            set -Eeuo pipefail
            root_keys={{ (rendered_shell_root ~ '/root-authorized_keys') | quote }}
            cp {{ (rendered_shell_root ~ '/ssh_host_ed25519_key.pub') | quote }} "$root_keys"
            chmod 0600 "$root_keys"
            if {{ (rendered_shell_root ~ '/ssh-key-audit') | quote }} status >status.out 2>&1; then
                echo 'Посторонний тестовый root-ключ не был обнаружен.' >&2
                exit 1
            fi
            grep -Fq 'WARN строка 1: 256 SHA256:' status.out || {
                cat status.out >&2
                exit 1
            }
            grep -Fq 'удалить: ssh-key-audit delete SHA256:' status.out || {
                cat status.out >&2
                exit 1
            }
            : >"$root_keys"
            {{ (rendered_shell_root ~ '/ssh-key-audit') | quote }} status |
                grep -Fq 'не содержит активных ключей'
            rm -f status.out "$root_keys"
          args:
            executable: /bin/bash
            chdir: "{{ rendered_shell_root }}"
          changed_when: false

        - name: Формирование конфигурации Unbound для Ubuntu 24.04
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../roles/entry_dns/templates/90-awg-dot.conf.j2"
            dest: "{{ rendered_shell_root }}/90-awg-dot.conf"
            mode: "0600"

        - name: Проверка конфигурации штатным unbound-checkconf Ubuntu 24.04
          ansible.builtin.command:
            argv:
              - unbound-checkconf
              - "{{ rendered_shell_root }}/90-awg-dot.conf"
          changed_when: false

        - name: Формирование защищённого модуля systemd для watchdog
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../roles/entry_watchdog/templates/awg-ru-proxy-watch.service.j2"
            dest: "{{ rendered_shell_root }}/awg-ru-proxy-watch.service"
            mode: "0600"

        - name: Формирование модуля атомарного обновления RU rule-set
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../roles/entry_routing/templates/awg-ru-zone-update.service.j2"
            dest: "{{ rendered_shell_root }}/awg-ru-zone-update.service"
            mode: "0600"

        - name: Проверка точного доступа службы только к каталогу rule-set
          ansible.builtin.shell: |
            set -Eeuo pipefail
            unit={{ (rendered_shell_root ~ '/awg-ru-zone-update.service') | quote }}
            grep -Fxq 'ProtectSystem=strict' "$unit"
            grep -Fxq 'ReadWritePaths={{ entry_ru_zone_state_dir }} /run {{ reality_fallback_rule_set_dir }}' "$unit"
            grep -Fxq 'ProtectClock=true' "$unit"
            ! grep -Fq 'rulesProtectClock=' "$unit"
            ! grep -Fq 'ReadWritePaths={{ reality_fallback_state_dir }}' "$unit"
          args:
            executable: /bin/bash
          changed_when: false

        - name: Формирование модуля systemd credentials для awg-quick@
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../roles/runtime_secrets/templates/awg-quick-credential.conf.j2"
            dest: "{{ rendered_shell_root }}/90-kalimerawg-runtime-secrets.conf"
            mode: "0600"

        - name: Выбор ветви health-шаблона ENTRY
          ansible.builtin.set_fact:
            awg_node_role: entry

        - name: Формирование health-программы ENTRY
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../roles/health/templates/awg-health.sh.j2"
            dest: "{{ rendered_shell_root }}/awg-health-entry"
            mode: "0700"

        - name: Загрузка безопасных примерных переменных EXIT
          ansible.builtin.include_vars:
            file: "{{ playbook_dir }}/../inventory/example/group_vars/exit.yml"

        - name: Выбор ветви health-шаблона EXIT
          ansible.builtin.set_fact:
            awg_node_role: exit

        - name: Формирование сводки текущей конфигурации EXIT
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../roles/terminal/templates/kalimera-status.py.j2"
            dest: "{{ rendered_shell_root }}/kalimera-status-exit"
            mode: "0700"

        - name: Исполняемая проверка сводки и табличной справки EXIT
          ansible.builtin.command:
            argv:
              - python3
              - "{{ rendered_shell_root }}/kalimera-status-exit"
              - --with-commands
          environment:
            NO_COLOR: "1"
          register: rendered_kalimera_status_exit
          changed_when: false
          failed_when: >-
            rendered_kalimera_status_exit.rc != 0 or
            'ПОДКЛЮЧЕНИЯ' not in rendered_kalimera_status_exit.stdout or
            'СХЕМА РАБОТЫ И DNS' not in rendered_kalimera_status_exit.stdout or
            'No-logs' not in rendered_kalimera_status_exit.stdout or
            'СОСТОЯНИЕ И ОБСЛУЖИВАНИЕ' not in rendered_kalimera_status_exit.stdout or
            'БЕЗОПАСНОСТЬ И УВЕДОМЛЕНИЯ' not in rendered_kalimera_status_exit.stdout or
            'VPN-КЛИЕНТЫ' in rendered_kalimera_status_exit.stdout

        - name: Формирование health-программы EXIT
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../roles/health/templates/awg-health.sh.j2"
            dest: "{{ rendered_shell_root }}/awg-health-exit"
            mode: "0700"

        - name: Формирование полной проверки роли EXIT
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../roles/terminal/templates/kalimera-test.sh.j2"
            dest: "{{ rendered_shell_root }}/kalimera-test-exit"
            mode: "0700"

        - name: Загрузка defaults и безопасных переменных FRONT
          ansible.builtin.include_vars:
            file: "{{ playbook_dir }}/../{{ item }}"
          loop:
            - roles/front/defaults/main.yml
            - inventory/example/group_vars/front.yml

        - name: Выбор ветви terminal-шаблона FRONT
          ansible.builtin.set_fact:
            awg_node_role: front
            front_relay_enabled: true
            front_entry_address: 192.0.2.10
            front_entry_reality_port: 443
            front_entry_reality_stopped: false

        - name: Формирование сводки текущей конфигурации FRONT
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../roles/terminal/templates/kalimera-status.py.j2"
            dest: "{{ rendered_shell_root }}/kalimera-status-front"
            mode: "0700"

        - name: Исполняемая проверка ролевой сводки FRONT
          ansible.builtin.command:
            argv:
              - python3
              - "{{ rendered_shell_root }}/kalimera-status-front"
              - --with-commands
          environment:
            NO_COLOR: "1"
          register: rendered_kalimera_status_front
          changed_when: false
          failed_when: >-
            rendered_kalimera_status_front.rc != 0 or
            'ПОДКЛЮЧЕНИЯ FRONT' not in rendered_kalimera_status_front.stdout or
            'СХЕМА FRONT' not in rendered_kalimera_status_front.stdout or
            'ЗАЩИТА FRONT' not in rendered_kalimera_status_front.stdout or
            'АВТОМАТИЧЕСКИ СОГЛАСОВАННЫЙ MTU' in rendered_kalimera_status_front.stdout or
            'VPN-КЛИЕНТЫ' in rendered_kalimera_status_front.stdout

        - name: Формирование health-программы FRONT
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../roles/health/templates/awg-health.sh.j2"
            dest: "{{ rendered_shell_root }}/awg-health-front"
            mode: "0700"

        - name: Проверка автономного формирования health FRONT без defaults common
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../roles/health/templates/awg-health.sh.j2"
            dest: "{{ rendered_shell_root }}/awg-health-front-standalone"
            mode: "0700"
          vars:
            awg_enable_fail2ban: "{{ undef(hint='defaults роли common намеренно недоступны') }}"

        - name: Формирование полной проверки роли FRONT
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../roles/terminal/templates/kalimera-test.sh.j2"
            dest: "{{ rendered_shell_root }}/kalimera-test-front"
            mode: "0700"

        - name: Проверка выбранных ролей в сформированных программах
          ansible.builtin.shell: |
            set -Eeuo pipefail
            grep -Fxq 'readonly role=exit' {{ rendered_shell_root }}/kalimera-test-exit
            grep -Fxq 'readonly role=front' {{ rendered_shell_root }}/kalimera-test-front
            grep -Fq 'Xray не может изменять каталог конфигурации' \
              {{ rendered_shell_root }}/awg-health-front
          args:
            executable: /bin/bash
          changed_when: false

        - name: Проверка сформированных программ через ShellCheck
          ansible.builtin.command:
            argv:
              - shellcheck
              - --exclude=SC2317
              - "{{ rendered_shell_root }}/awg-entry-routing"
              - "{{ rendered_shell_root }}/awg-entry-routing-reconcile"
              - "{{ rendered_shell_root }}/awg-ru-zone-update"
