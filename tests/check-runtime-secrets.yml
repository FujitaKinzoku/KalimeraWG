---
- name: Проверка порогового runtime-хранилища
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  vars:
    runtime_secrets_config_path: /tmp/kalimerawg-runtime-acceptance/config.json
    runtime_secretctl_test_path: /tmp/kalimerawg-secretctl-acceptance

  tasks:
    - name: Формирование программы порогового хранилища
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/runtime_secrets/templates/secretctl.py.j2"
        dest: "{{ runtime_secretctl_test_path }}"
        owner: root
        group: root
        mode: "0750"

    - name: Выполнение приёмки 2-of-3, повторного seal, reboot и tamper fail-closed
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/runtime_secret_acceptance.py"
          - "{{ runtime_secretctl_test_path }}"
      changed_when: false

  post_tasks:
    - name: Удаление сформированной тестовой программы
      ansible.builtin.file:
        path: "{{ runtime_secretctl_test_path }}"
        state: absent
      changed_when: false
