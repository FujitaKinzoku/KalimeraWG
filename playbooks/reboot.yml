---
# Плановая перезагрузка одного сервера каскада. Вызывает cascade-reboot, который
# задаёт cascade_reboot_group (front или exit) и проверяет каскад после каждого
# шага. ENTRY сюда не входит: его перезагрузка обрывает Ansible на самом ENTRY.
- name: Перезагрузка сервера каскада
  hosts: "{{ cascade_reboot_group }}"
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Перезагрузка сервера
      ansible.builtin.reboot:
        msg: Плановая перезагрузка каскада KalimeraWG
        reboot_timeout: 900
        post_reboot_delay: 60
