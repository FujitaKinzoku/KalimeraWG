---
- name: Проверка развёрнутой AWG-инфраструктуры без раскрытия секретов
  hosts: all
  gather_facts: false
  any_errors_fatal: true
  tasks:
    # awg-kernel-guard ставит roles/operations и он обслуживает DKMS-модуль
    # AmneziaWG — на FRONT нет ни этой роли, ни самого модуля
    # (docs/front-relay.md). Проверка состояния ниже, наоборот, на FRONT
    # нужна: roles/health там применяется и имеет собственную ветку.
    - name: Подготовка DKMS для текущего и следующего загрузочного ядра
      ansible.builtin.command: /usr/local/sbin/awg-kernel-guard
      changed_when: false
      when: awg_node_role | default('') in ['entry', 'exit']

    - name: Запуск строгой проверки состояния сервера
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/awg-health
          - --strict
      register: awg_health_result
      changed_when: false
      retries: 36
      delay: 5
      until: awg_health_result.rc == 0

    - name: Вывод результата проверки без секретных данных
      ansible.builtin.debug:
        var: awg_health_result.stdout_lines
