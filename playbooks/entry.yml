---
- name: Настройка ENTRY сервера
  hosts: entry
  gather_facts: false
  any_errors_fatal: true
  pre_tasks:
    # Проверка до любых изменений: без внешнего адреса ENTRY вход отчёта на
    # EXIT и FRONT был бы записан как 127.0.0.1 и не работал.
    - name: Проверка внешнего адреса ENTRY для отчёта cascade-check
      ansible.builtin.assert:
        quiet: true
        that:
          - cascade_check_source is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
          - cascade_check_source is not match('^127\.')
        fail_msg: >-
          Задайте cascade_check_entry_source_ipv4: внешний IPv4 ENTRY, с которого он
          ходит на EXIT и FRONT. ansible_host ENTRY здесь локальный или не подходит.
      vars:
        cascade_check_source: "{{ cascade_check_entry_source_ipv4 | default(ansible_host) }}"
      when: awg_adoption_mode == 'apply'
    - name: Сбор сведений об ENTRY сервере
      ansible.builtin.setup:

    - name: Проверка служб перед защищённой установкой
      ansible.builtin.service_facts:
      when: not (awg_enable_fail2ban | default(true) | bool)
    - name: Остановка ранее запущенного Fail2Ban на время перехода SSH
      ansible.builtin.systemd_service:
        name: fail2ban.service
        state: stopped
      when:
        - not (awg_enable_fail2ban | default(true) | bool)
        - "'fail2ban.service' in ansible_facts.services"
  roles:
    - preflight
    - role: common
      when: awg_adoption_mode == 'apply'
    - role: terminal
      when: awg_adoption_mode == 'apply'
    - role: amneziawg
      when: awg_adoption_mode == 'apply'
    - role: security
      when: awg_adoption_mode == 'apply'
    - role: cascade_check
      when: awg_adoption_mode == 'apply'
    - role: entry
      when: awg_adoption_mode == 'apply'
    - role: awg3_transit
      when: awg_adoption_mode == 'apply'
    - role: awg3_mobile
      when: awg_adoption_mode == 'apply'
    - role: sing_box
      when: awg_adoption_mode == 'apply'
    - role: entry_routing
      when: awg_adoption_mode == 'apply'
    - role: entry_dns
      when: awg_adoption_mode == 'apply'
    - role: operations
      when: awg_adoption_mode == 'apply'
    - role: entry_watchdog
      when: awg_adoption_mode == 'apply'
    - role: fail2ban
      when: awg_adoption_mode == 'apply'
    - role: health
      when: awg_adoption_mode == 'apply'
