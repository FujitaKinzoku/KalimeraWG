---
- name: Восстановление предыдущих пакетов AmneziaWG после неудачного обновления
  ansible.builtin.include_tasks: rollback.yml
  when: awg_package_rollback | bool

- name: Завершение роли после восстановления пакетов AmneziaWG
  ansible.builtin.meta: end_role
  when: awg_package_rollback | bool

- name: Установка средств проверки подписи PPA AmneziaWG
  ansible.builtin.apt:
    name:
      - ca-certificates
      - gnupg
    state: present
    lock_timeout: 600

- name: Создание каталога изолированных ключей APT
  ansible.builtin.file:
    path: "{{ amneziawg_ppa_keyring_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# get_url с force: false всё равно делает условный запрос к keyserver.ubuntu.com,
# поэтому при его недоступности deploy падал даже с уже установленным ключом.
# Ключ скачивается, только если файла нет или в нём не тот отпечаток.
- name: Проверка уже установленного ключа PPA AmneziaWG
  ansible.builtin.command:
    argv:
      - /usr/bin/gpg
      - --batch
      - --show-keys
      - --with-colons
      - "{{ amneziawg_ppa_keyring_path }}"
  register: amneziawg_ppa_key_existing
  changed_when: false
  failed_when: false

- name: Загрузка отдельного ключа PPA AmneziaWG
  ansible.builtin.get_url:
    url: "{{ amneziawg_ppa_key_url }}"
    dest: "{{ amneziawg_ppa_keyring_path }}"
    owner: root
    group: root
    mode: "0644"
    force: true
  register: amneziawg_ppa_key_download
  when: >-
    amneziawg_ppa_key_existing.rc != 0 or
    ('fpr:::::::::' ~ amneziawg_ppa_fingerprint ~ ':') not in
    amneziawg_ppa_key_existing.stdout

- name: Права установленного ключа PPA AmneziaWG
  ansible.builtin.file:
    path: "{{ amneziawg_ppa_keyring_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Проверка полного отпечатка ключа PPA AmneziaWG
  ansible.builtin.command:
    argv:
      - /usr/bin/gpg
      - --batch
      - --show-keys
      - --with-colons
      - "{{ amneziawg_ppa_keyring_path }}"
  register: amneziawg_ppa_key_details
  changed_when: false
  failed_when: >-
    amneziawg_ppa_key_details.rc != 0 or
    ('fpr:::::::::' ~ amneziawg_ppa_fingerprint ~ ':') not in
    amneziawg_ppa_key_details.stdout

- name: Подключение PPA AmneziaWG через отдельный Signed-By keyring
  ansible.builtin.template:
    src: amnezia-ppa.sources.j2
    dest: "{{ amneziawg_ppa_source_path }}"
    owner: root
    group: root
    mode: "0644"
  register: amneziawg_ppa_source

- name: Проверка подписанного индекса PPA AmneziaWG
  ansible.builtin.apt:
    update_cache: true
    lock_timeout: 600
  when: amneziawg_ppa_key_download.changed or amneziawg_ppa_source.changed

- name: Удаление прежнего подключения PPA без выделенного Signed-By
  ansible.builtin.apt_repository:
    repo: "{{ amneziawg_ppa_legacy }}"
    state: absent
    update_cache: false

- name: Проверка политики выбора пакетов AmneziaWG
  ansible.builtin.assert:
    quiet: true
    that:
      - awg_package_version_mode in ['pinned', 'candidate']
      - awg_package_version_mode == 'candidate' or awg_package_versions is defined
    fail_msg: "Включите автоматический выбор либо укажите проверенные версии пакетов AmneziaWG"

- name: Установка средств сборки для текущего ядра
  ansible.builtin.apt:
    name: "{{ amneziawg_build_packages }}"
    state: present
    update_cache: false
    lock_timeout: 600

- name: Проверка ранее закреплённого списка версий AmneziaWG
  ansible.builtin.stat:
    path: "{{ amneziawg_package_lock_path }}"
  register: amneziawg_existing_lock
  when:
    - awg_package_version_mode == 'candidate'
    - not awg_package_refresh | bool

- name: Чтение ранее закреплённого списка версий AmneziaWG
  ansible.builtin.slurp:
    path: "{{ amneziawg_package_lock_path }}"
  register: amneziawg_existing_lock_content
  when:
    - awg_package_version_mode == 'candidate'
    - not awg_package_refresh | bool
    - amneziawg_existing_lock.stat.exists

- name: Выбор воспроизводимого списка версий AmneziaWG
  ansible.builtin.set_fact:
    amneziawg_resolved_packages: >-
      {{ local_lock if local_lock | length == amneziawg_package_names | length
         else entry_lock }}
  vars:
    local_lock: >-
      {{ [] if awg_package_refresh | bool else
         ((amneziawg_existing_lock_content.content | default('') | b64decode).splitlines() |
          select('match', '^(amneziawg|amneziawg-dkms|amneziawg-tools)=') | list) }}
    entry_lock: >-
      {{ (hostvars[groups['entry'][0]].amneziawg_resolved_packages | default([]))
         if awg_node_role == 'exit' and groups['entry'] | default([]) | length == 1
         else [] }}
  when: awg_package_version_mode == 'candidate'

- name: Очистка каталога отката перед явным обновлением AmneziaWG
  ansible.builtin.file:
    path: "{{ amneziawg_component_rollback_dir }}"
    state: absent
  when: awg_package_refresh | bool

- name: Создание каталогов транзакционного обновления AmneziaWG
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ amneziawg_component_rollback_dir }}"
    - "{{ amneziawg_component_rollback_dir }}/previous"
    - "{{ amneziawg_component_rollback_dir }}/candidate"
  when: awg_package_refresh | bool

- name: Чтение установленных версий перед обновлением AmneziaWG
  ansible.builtin.command:
    argv:
      - /usr/bin/dpkg-query
      - -W
      - "-f=${Package}=${Version}\n"
      - "{{ item }}"
  loop: "{{ amneziawg_package_names }}"
  register: amneziawg_installed_before_update
  changed_when: false
  when: awg_package_refresh | bool

- name: Проверка полного набора установленных пакетов перед обновлением
  ansible.builtin.assert:
    quiet: true
    that:
      - amneziawg_installed_before_update.results | length == amneziawg_package_names | length
      - amneziawg_installed_before_update.results | selectattr('rc', 'equalto', 0) | list | length == amneziawg_package_names | length
    fail_msg: "Нельзя безопасно обновить неполную установку AmneziaWG"
  when: awg_package_refresh | bool

# Откат должен работать и тогда, когда PPA уже не отдаёт прежнюю версию. Поэтому
# предыдущие пакеты берутся из локального хранилища или из кэша apt, а из PPA -
# только если локальной копии нет. Всё это выполняется до установки новых
# пакетов: если полного набора нет нигде, обновление останавливается, серверы не
# меняются.
- name: Подготовка локального хранилища пакетов AmneziaWG
  ansible.builtin.file:
    path: "{{ amneziawg_package_store_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: awg_package_refresh | bool

- name: Поиск локальных копий установленных пакетов AmneziaWG
  ansible.builtin.find:
    paths:
      - "{{ amneziawg_package_store_dir }}"
      - /var/cache/apt/archives
    patterns: "{{ item.split('=')[0] }}_{{ item.split('=')[1] | replace(':', '%3a') }}_*.deb"
    file_type: file
  loop: "{{ amneziawg_installed_before_update.results | map(attribute='stdout') | map('trim') | list }}"
  loop_control:
    label: "{{ item }}"
  register: amneziawg_local_copies
  when: awg_package_refresh | bool

- name: Загрузка из PPA предыдущих пакетов AmneziaWG, которых нет локально
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/bin/apt-get', 'download'] +
         (amneziawg_local_copies.results | rejectattr('matched', 'gt', 0) | map(attribute='item') | list) }}
    chdir: "{{ amneziawg_component_rollback_dir }}/previous"
  environment:
    DEBIAN_FRONTEND: noninteractive
  changed_when: false
  when:
    - awg_package_refresh | bool
    - amneziawg_local_copies.results | rejectattr('matched', 'gt', 0) | list | length > 0

- name: Копирование локальных копий предыдущих пакетов AmneziaWG для отката
  ansible.builtin.copy:
    src: "{{ item.files[0].path }}"
    dest: "{{ amneziawg_component_rollback_dir }}/previous/{{ item.files[0].path | basename }}"
    remote_src: true
    owner: root
    group: root
    mode: "0600"
  loop: "{{ amneziawg_local_copies.results | selectattr('matched', 'gt', 0) | list }}"
  loop_control:
    label: "{{ item.item }}"
  when: awg_package_refresh | bool

- name: Поиск предыдущих пакетов AmneziaWG для отката
  ansible.builtin.find:
    paths: "{{ amneziawg_component_rollback_dir }}/previous"
    patterns: "*.deb"
    file_type: file
  register: amneziawg_previous_packages
  when: awg_package_refresh | bool

- name: Проверка, что предыдущие пакеты AmneziaWG готовы для отката
  ansible.builtin.assert:
    quiet: true
    that:
      - amneziawg_previous_packages.matched == amneziawg_package_names | length
    fail_msg: "Нет полного набора предыдущих пакетов AmneziaWG для отката; серверы не изменены"
  when: awg_package_refresh | bool

- name: Определение необходимости обращения к PPA AmneziaWG
  ansible.builtin.set_fact:
    amneziawg_candidate_lookup_required: >-
      {{ amneziawg_resolved_packages | default([]) | length == 0 }}
  when: awg_package_version_mode == 'candidate'

- name: Получение опубликованных в PPA версий пакетов
  ansible.builtin.command:
    argv: [/usr/bin/apt-cache, madison, "{{ item }}"]
  loop: "{{ amneziawg_package_names }}"
  register: amneziawg_candidate_policy
  changed_when: false
  when:
    - awg_package_version_mode == 'candidate'
    - amneziawg_candidate_lookup_required | bool

- name: Формирование точного списка версий пакетов для установки
  ansible.builtin.set_fact:
    amneziawg_resolved_packages: >-
      {{ (amneziawg_resolved_packages | default([])) +
         [item.item ~ '=' ~
          (((item.stdout_lines |
             select('search', '\\|') |
             first).split('|')[1]) | trim)] }}
  loop: "{{ amneziawg_candidate_policy.results | default([]) }}"
  when:
    - awg_package_version_mode == 'candidate'
    - amneziawg_candidate_lookup_required | bool
    - item.stdout_lines | select('search', '\\|') | list | length > 0

- name: Проверка доступности всех необходимых пакетов
  ansible.builtin.assert:
    quiet: true
    that:
      - amneziawg_resolved_packages | default([]) | length == amneziawg_package_names | length
    fail_msg: "Подключённый PPA AmneziaWG не предоставляет все необходимые пакеты"
  when: awg_package_version_mode == 'candidate'

- name: Предварительная загрузка новых пакетов до изменения работающей системы
  ansible.builtin.command:
    argv: "{{ ['/usr/bin/apt-get', 'download'] + amneziawg_resolved_packages }}"
    chdir: "{{ amneziawg_component_rollback_dir }}/candidate"
  environment:
    DEBIAN_FRONTEND: noninteractive
  changed_when: false
  when: awg_package_refresh | bool

- name: Выбор проверенных закреплённых версий пакетов
  ansible.builtin.set_fact:
    amneziawg_resolved_packages:
      - "amneziawg={{ awg_package_versions.amneziawg }}"
      - "amneziawg-dkms={{ awg_package_versions.amneziawg_dkms }}"
      - "amneziawg-tools={{ awg_package_versions.amneziawg_tools }}"
  when: awg_package_version_mode == 'pinned'

- name: Установка выбранных версий пакетов AmneziaWG
  ansible.builtin.apt:
    name: "{{ amneziawg_resolved_packages }}"
    state: present
    allow_downgrade: true
    update_cache: false
    lock_timeout: 600

- name: Создание каталога локального списка версий
  ansible.builtin.file:
    path: "{{ amneziawg_package_lock_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Запись установленных версий AmneziaWG
  ansible.builtin.copy:
    dest: "{{ amneziawg_package_lock_path }}"
    content: "{{ amneziawg_resolved_packages | sort | join('\n') }}\n"
    owner: root
    group: root
    mode: "0644"

- name: Сборка DKMS-модулей для текущего ядра
  ansible.builtin.command:
    argv:
      - /usr/sbin/dkms
      - autoinstall
      - -k
      - "{{ ansible_kernel }}"
  register: amneziawg_dkms_autoinstall
  changed_when: amneziawg_dkms_autoinstall.stdout | trim | length > 0

- name: Обновление зависимостей модулей текущего ядра
  ansible.builtin.command:
    argv:
      - /usr/sbin/depmod
      - -a
      - "{{ ansible_kernel }}"
  changed_when: false

- name: Проверка доступности модуля ядра AmneziaWG
  community.general.modprobe:
    name: amneziawg
    state: present

# Хранилище заполняется только после успешной установки и проверки модуля.
# Поиск идёт по точной версии установленного пакета, поэтому лишняя копия
# новой версии после отката не будет выбрана вместо прежней.
- name: Поиск установленных пакетов AmneziaWG для локального хранилища
  ansible.builtin.find:
    paths: "{{ amneziawg_component_rollback_dir }}/candidate"
    patterns: "*.deb"
    file_type: file
  register: amneziawg_candidate_packages
  when: awg_package_refresh | bool

- name: Сохранение установленных пакетов AmneziaWG в локальном хранилище
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ amneziawg_package_store_dir }}/{{ item.path | basename }}"
    remote_src: true
    owner: root
    group: root
    mode: "0600"
  loop: "{{ amneziawg_candidate_packages.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: awg_package_refresh | bool
