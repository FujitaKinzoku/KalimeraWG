---
entry_required_interfaces:
  - awg0
  - awg1
entry_required_ipsets:
  - force_exit
  - force_ru
  - force_entry_bank
  - ru
  - ru_tmp
entry_manage_awg_configs: false
entry_awg_config_dir: /etc/amnezia/amneziawg
entry_awg_backup_root: /root/config-backups/entry/awg
entry_awg_candidate_root: /run/awg-ansible
entry_legacy_exit_interface: awg1
entry_awg_client_mode: modern
entry_awg_client_mtu: 1380
entry_awg0_listen_port: 443
awg3_transit_enabled: false
entry_legacy_client_available: false
entry_legacy_client_enabled: false
entry_legacy_client_interface: awg-old
entry_legacy_client_address: 10.67.0.1/24
entry_legacy_client_listen_address: 10.67.0.1
entry_legacy_client_subnet: 10.67.0.0/24
entry_legacy_client_listen_port: 39744
entry_legacy_client_mtu: 1280
entry_mobile_client_available: false
entry_mobile_client_enabled: false
entry_mobile_client_interface: awg-mobile
entry_mobile_client_address: 10.68.0.1/24
entry_mobile_client_listen_address: 10.68.0.1
entry_mobile_client_subnet: 10.68.0.0/24
entry_mobile_client_listen_port: 8443
# Эти значения нужны только для удаления правил старой схемы UDP/53 -> UDP/39746.
entry_mobile_legacy_public_port: 53
entry_mobile_legacy_internal_port: 39746
entry_mobile_client_mtu: 1380
entry_mobile_firewall_path: /usr/local/sbin/awg-mobile-firewall
entry_mobile_i1_mode: quic-ios
