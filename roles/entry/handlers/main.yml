---
- name: "Перезапуск: ENTRY сервер - этап 1"
  ansible.builtin.systemd_service:
    name: "awg-quick@{{ item }}.service"
    state: restarted
  loop: >-
    {{ [entry_client_interface] +
       ([entry_legacy_client_interface] if entry_legacy_client_enabled | bool else []) +
       ([entry_exit_interface] if not (awg3_transit_enabled | default(false) | bool) else []) }}
  listen: Перезапустить интерфейсы AWG ENTRY сервера
