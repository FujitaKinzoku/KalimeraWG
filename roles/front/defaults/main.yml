---
# FRONT: CDN-фронтированный VLESS+XHTTP релей на Xray-core, авторизуется на
# ENTRY как обычный REALITY-клиент (см. docs/front-relay.md). Выключено по
# умолчанию - роль не создаёт файлов/сервисов, пока не включено явно через
# ./deploy --enable-front.
front_enabled: false
front_relay_enabled: "{{ front_enabled | bool }}"
front_access_modes:
  - direct
front_cdn_state: not_configured
front_active_id: front-1
front_replacement_state: active
front_previous_public_ipv4: ""
front_direct_domain: "{{ front_origin_domain }}"
front_cdn_domain: ""

front_xray_service_name: xray.service
front_xray_binary_path: /usr/local/bin/xray
front_xray_package_cache: /var/cache/ansible/xray.zip
front_xray_config_path: /usr/local/etc/xray/config.json
front_xray_base_config_path: /usr/local/etc/xray/config.base.json
front_systemctl_path: /usr/bin/systemctl
front_xray_state_dir: /usr/local/etc/xray
front_xray_user: xray
front_xray_group: xray

# Реестр пользователей и параметры экспорта находятся в том же зашифрованном
# runtime-каталоге, что конфигурация Xray. На постоянном диске остаётся только
# аутентифицированный пакет runtime-secrets.
front_vless_users_path: "{{ front_xray_state_dir }}/users.json"
front_vless_client_settings_path: "{{ front_xray_state_dir }}/client-settings.json"
front_vless_user_command_path: /usr/local/sbin/vless-user
front_vless_export_dir: /run/kalimera-vless-exports
front_vless_initial_user_name: initial

# Закреплённые релизы Xray-core (XTLS/Xray-core) с проверенным checksum по
# архитектуре - тот же паттерн, что entry_sing_box_packages в roles/sing_box.
# Xray-core не публикует .deb - только сырой архив с бинарником, поэтому
# устанавливается вручную (unzip + install), не через apt.
#
# v26.3.27 -> v26.7.28: клиенты (Happ v5.6.0 подтверждённо бандлит именно
# v26.7.28 - видно в его собственном логе "Xray <версия> started" при
# JSON-профиле) успели уйти вперёд закреплённой здесь версии, и это не
# косметика - между этими версиями реально разошлось поведение XHTTP:
# v26.3.27 строго валидирует путь с завершающим слэшем, которого новые
# клиенты не шлют ("failed to validate path"), и по-другому договаривается
# о packet-up/stream-one режиме ("stream-one mode is not allowed" даже при
# явном mode: packet-up). Оба факта воспроизведены локально парой
# client+server на реальных бинарниках, не выведены из документации.
# Обновление версии клиентов ПЕРИОДИЧЕСКОЕ и происходит вне контроля этого
# проекта - см. "Актуальность версии Xray-core" в docs/front-relay.md за
# тем, как и когда проверять, не отстала ли эта версия снова.
#
# v26.7.28 -> v26.10.31: два срочных выпуска безопасности (из встроенного
# списка удалены скомпрометированные корневые сертификаты; MPTCP по умолчанию
# выключен из-за CVE-2026-98432) и та же версия, что в Happ после обновления.
# Пара client+server на реальных бинарниках с конфигами этой роли проверена во
# всех сочетаниях 26.7.28/26.10.31, с маскировкой и без: скачивание и отдача
# через аплинк в заголовках проходят, клиентские профили перевыпускать не нужно.
# Контрольные суммы совпали в трёх источниках: поле digest GitHub, файл .dgst
# выпуска и SHA256 скачанного архива.
front_xray_version: v26.10.31
front_xray_packages:
  x86_64:
    url: "https://github.com/XTLS/Xray-core/releases/download/v26.10.31/Xray-linux-64.zip"
    checksum: "sha256:e4bd9119f50ae7c41658b1abd0679ae06f98bd864a2907ff33f2f2cf7081b214"
  aarch64:
    url: "https://github.com/XTLS/Xray-core/releases/download/v26.10.31/Xray-linux-arm64-v8a.zip"
    checksum: "sha256:1811c8f1da0c3b6dc707ebaf1c8390e987ba39859a8f0a7aadd8526157f2ec8d"

# Origin-домен, на который указывает A-запись FRONT и CNAME CDN-ресурса
# (настраивается вручную вне Ansible - см. docs/front-relay.md). Обязателен,
# если front_relay_enabled: true.
front_origin_domain: ""
front_certbot_email: ""

front_xhttp_listen_port: 8080
# Режим загрузки XHTTP: packet-up | stream-up | stream-one | auto.
# packet-up - единственный режим, который проходит Yandex Cloud CDN: каждый
# пакет аплинка уходит отдельным коротким GET-запросом. POST/PUT/PATCH/DELETE
# на Yandex Cloud CDN по умолчанию выключены и включаются только через
# поддержку, а аплинк через POST уже приводил к полному обрыву связи через
# CDN. Остальные режимы быстрее, но требуют POST и CDN без буферизации тела
# запроса. GET при этом обязан быть БЕЗ ТЕЛА - см. front_xhttp_uplink_* ниже.
# Сам Xray запрещает "uplinkHTTPMethod": "GET" вне packet-up
# ("uplinkHTTPMethod can be GET only in packet-up mode"), поэтому GET
# подставляется в конфигурацию только для packet-up.
front_xhttp_mode: packet-up

# Куда packet-up кладёт полезную нагрузку аплинка.
#
# Yandex Cloud CDN отвечает "413 Payload Too Large" на ЛЮБОЙ запрос GET, HEAD
# или OPTIONS, у которого есть тело: по официальной документации (выпуск от
# 30.09.2026) ошибка вызвана самим наличием тела, а не его размером. Прежний
# профиль клал аплинк в тело GET-запроса (uplinkDataPlacement: body), и с
# этого момента CDN отбивал каждый пакет аплинка сам, до FRONT не доходило
# ничего. Подтверждено живыми пробами через CDN: GET с телом в 8 байт - 413,
# а GET без тела с теми же cookie и query и с одиночным заголовком 1000, 3000
# и 6000 байт - 200 от Xray. Напрямую, без CDN, вся цепочка при этом работала.
# Что сами заголовки аплинка доходят до Xray целиком, проверяет awg-health на
# FRONT с режимом cdn (front_uplink_reaches_xray): через CDN, а пока замена
# FRONT не подтверждена - напрямую через origin-домен.
#
# POST у CDN нет (см. front_xhttp_mode), поэтому метод остаётся GET, а
# нагрузка переезжает из тела в заголовки: Xray-core кодирует пакет base64url
# без паддинга, режет его на заголовки <ключ>-0, <ключ>-1, ... и оставляет
# тело пустым (transport/internet/splithttp/config.go,
# GetRequestHeaderWithPayload и FillPacketRequest в v26.7.28). Допустимы
# header и cookie, оба Xray разрешает только в packet-up. header выбран
# потому, что при cookie все куски вместе с id сессии и паддингом Go
# склеивает в ОДНУ строку Cookie (net/http, Request.AddCookie), и
# единственный проверенный предел - одиночный заголовок 6000 байт -
# ограничил бы пакет примерно 4 КБ; в заголовках каждый кусок - отдельная
# строка. body и auto не допускаются: клиент Xray в обоих случаях шлёт тело.
#
# Сервер FRONT принимает аплинк в режиме auto - заголовки, cookie и тело
# одновременно (transport/internet/splithttp/hub.go). Это совместимо с
# любым из клиентских вариантов, допустимо в любом режиме XHTTP и оставляет
# работающими прежние JSON с телом на прямом пути до их перевыпуска.
# Совпадать обязан только ключ: сервер читает заголовки строго с
# собственным uplinkDataKey и при несовпадении молча получает пустой пакет.
front_xhttp_uplink_data_placement: header
# Имя заголовков аплинка: только латиница, цифры и дефис. Nginx по
# умолчанию (underscores_in_headers off + ignore_invalid_headers on) молча
# выбрасывает заголовки с подчёркиванием, и прежний ключ _dc в роли
# заголовка _dc-0 до Xray просто не дошёл бы: Xray принял бы пустой пакет
# как валидный, ответил 200, а поток внутри VLESS Encryption развалился бы
# без единой ошибки. Встроенное значение Xray (X-Data) - готовый отпечаток,
# поэтому имя задано явно.
front_xhttp_uplink_data_key: X-Client-State
# Длина одного заголовка аплинка в символах base64url (не в байтах пакета);
# Xray выбирает её случайно из диапазона для каждого куска. 3000 - половина
# проверенных через CDN 6000 байт одиночного заголовка; вместе с именем это
# строка около 3020 байт, далеко от предела nginx на одно поле (по умолчанию
# large_client_header_buffers 4 8k, тот же предел действует для HTTP/2).
front_xhttp_uplink_chunk_size: "2800-3000"
# Наибольший пакет аплинка на один GET, байт. Без явного значения Xray берёт
# 1 000 000, и с нагрузкой в заголовках один запрос раздулся бы до сотен
# заголовков. 4096 байт = 5462 символа base64url = всегда ровно два заголовка
# по 2800-3000 символов, около 5,5 КБ нагрузки и около 6,1 КБ всех
# заголовков на запрос вместе с cookie и заголовками браузера, которые
# добавляет Xray. Это примерно столько же, сколько несла проверенная живая
# проба с одиночным заголовком 6000 байт, а не с запасом, поэтому сам размер
# подтверждает awg-health пробой не меньше настоящего пакета.
#
# При таком бюджете заголовков 4096 - лучшее значение. VLESS Encryption на
# каждые 8192 байта данных пишет запись 8213 байт (5 + n + 16,
# proxy/vless/encryption/common.go, CommonConn.Write), XHTTP кладёт её в
# очередь аплинка двумя кусками 8192 и 21 байт (splithttp/dialer.go,
# uploadWriter), а очередь при scMaxEachPostBytes до 8192 вмещает только один
# кусок (pipe.WithSizeLimit(max(0, scMaxEachPostBytes - 8192))). Поэтому
# каждая запись уходит тремя запросами 4096 + 4096 + 21 байт - и при 4096,
# и при любом значении до 8212, а меньше 4096 - уже четырьмя. Склеить хвост
# в 21 байт можно только начиная с 8213: например, 8213 при uplinkChunkSize
# "5476-5600" дало бы ровно два заголовка до ~5,6 КБ, около 11,2 КБ
# заголовков на запрос и примерно втрое больший аплинк, но такой размер
# через CDN не проверен - только после живой пробы ~12 КБ заголовков в
# одном запросе.
front_xhttp_uplink_max_each_post_bytes: 4096
# Минимальный интервал между запросами аплинка, мс. Xray отправляет запросы
# аплинка конвейером, не дожидаясь ответа, поэтому потолок аплинка - 8192
# байта данных (одна запись VLESS Encryption, см. выше) за три интервала:
# при 8-12 мс (в среднем 10) это около 270 КБ/с (~2,2 Мбит/с) и до ~100
# запросов в секунду. Измерено на настоящем Xray v26.7.28 через эмулятор
# правил CDN: 5 МБ аплинка за ~19 с, около 273 КБ/с. Встроенные 30 мс дали
# бы втрое меньше (~0,7 Мбит/с). Короче интервал - быстрее аплинк, но и
# больше запросов в секунду через CDN. Редкий трафик интервал не задерживает.
front_xhttp_uplink_min_posts_interval_ms: "8-12"
# Предел заголовков HTTP-сервера Xray (serverMaxHeaderBytes, Go добавляет к
# нему ещё 4096). Встроенные 8192 покрыли бы такой запрос вместе с
# заголовками браузера, CDN и nginx (около 7,5 КБ) с небольшим запасом;
# 16384 даёт запас и для пакетов крупнее, а слушатель Xray всё равно
# доступен только с 127.0.0.1 через nginx.
front_xhttp_server_max_header_bytes: 16384
# Сколько пакетов аплинка, пришедших не по порядку, сервер Xray держит в
# очереди одной сессии (scMaxBufferedPosts). Встроенные 30 рассчитаны на
# редкие крупные запросы с телом; теперь аплинк идёт мелкими GET до ~100 в
# секунду и через CDN по нескольким соединениям (xmux maxConnections 3), так
# что задержка одного запроса между CDN и origin на ~0,3 с переполнила бы 30
# и оборвала бы сессию ("packet queue is too large", upload_queue.go v26.7.28).
# 200 пакетов - не больше ~0,8 МБ памяти на сессию при пакетах до 4096 байт.
front_xhttp_server_max_buffered_posts: 200

# Flow VLESS на хопе FRONT -> ENTRY.
#
# В Xray "xtls-rprx-vision" ПЕРЕХВАТЫВАЕТ UDP/443 (QUIC), чтобы браузер на
# самом клиенте откатился на обычный HTTPS. Для клиента, стоящего прямо на
# устройстве, это безвредно - приложение сразу видит отказ и переключается
# на TCP. Но FRONT стоит посередине: телефон отправляет QUIC, перехват
# происходит на FRONT, и до приложения отказ не доходит - оно ждёт
# таймаута. Именно так ломается воспроизведение YouTube при работающих
# Telegram и обычных сайтах.
#
# "xtls-rprx-vision-udp443" - то же самое, но без перехвата UDP/443, и
# именно ему соответствует "xtls-rprx-vision" в sing-box (ENTRY): там
# UDP/443 не блокируется. То есть это значение приводит поведение Xray в
# соответствие с тем, что уже настроено на стороне ENTRY.
front_reality_flow: xtls-rprx-vision-udp443
# Путь VLESS+XHTTP на CDN - намеренно не дефолтный "/api/stream" при
# развёртывании, чтобы не давать лёгкий fingerprint по общеизвестному пути
# (переопределяется в group_vars/front.yml).
front_xhttp_path: /api/stream

front_origin_cert_path: "/etc/letsencrypt/live/{{ front_origin_domain }}/fullchain.pem"
front_origin_key_path: "/etc/letsencrypt/live/{{ front_origin_domain }}/privkey.pem"

front_nginx_site_path: /etc/nginx/sites-available/front-relay.conf
front_nginx_site_link_path: /etc/nginx/sites-enabled/front-relay.conf
front_nginx_default_site_link_path: /etc/nginx/sites-enabled/default

# VLESS Encryption - дополнительный к TLS согласованный слой клиента и FRONT.
# `xray vlessenc` создаёт серверную decryption и клиентскую encryption одной
# пары. Автоматизированный FRONT всегда использует вариант ML-KEM-768 + X25519.
front_vless_encryption_enabled: true
front_vless_decryption_path: "{{ front_xray_state_dir }}/vless-decryption"
front_vless_encryption_path: "{{ front_xray_state_dir }}/vless-encryption"

# Маскировка XHTTP под конкретное веб-приложение, а не просто "случайный
# HTTP-путь": id сессии в cookie, номер пакета в query, паддинг под токен в
# cookie; нагрузка аплинка - в заголовках (front_xhttp_uplink_*). Значения
# ниже (PHPESSID/mc_token) - прежняя легенда из конфига стороннего
# VPN-провайдера: её же используют и другие, а PHPESSID - опечатка
# настоящего PHPSESSID. Они остаются только для FRONT, установленных до
# v3.1.0, чтобы их клиентские профили продолжали работать. Новая установка
# записывает в group_vars/front.yml собственный набор, выбранный случайно
# из правдоподобных легенд (scripts/lib/interactive_deploy.py,
# new_front_disguise); kalimera-deploy --resume --rotate-front-disguise
# заменяет его на существующем FRONT. Выдаётся полный JSON, поэтому вложенный объект extra
# сохраняется без потери параметров. При наличии extra Xray-core берёт из
# xhttpSettings снаружи только host, path и mode
# (infra/conf/transport_method.go, SplitHTTPConfig.Build), поэтому все
# действующие поля аплинка обязаны быть и внутри extra.
#
# id сессии генерируется по предопределённой таблице "hex" длиной 32 - так
# выглядит id сессии PHP с настройками по умолчанию (php-src,
# ext/session/session.c: session.sid_length 32, session.sid_bits_per_character
# 4). Прежнее значение "Base36" не было именем таблицы Xray (есть только
# "BASE36" и "base36"), и Xray брал саму строку как алфавит: каждый id
# состоял лишь из символов B, a, s, e, 3 и 6 - явный отпечаток.
front_xhttp_disguise_enabled: true
front_xhttp_disguise_session_cookie: PHPESSID
front_xhttp_disguise_session_table: hex
front_xhttp_disguise_session_length: 32
front_xhttp_disguise_padding_key: mc_token

# Домен, на который в итоге смотрит клиент - сегодня совпадает с
# origin-доменом (CDN ещё не настроен), после подключения внешнего CDN
# достаточно переопределить только эту переменную в group_vars/front.yml.
front_client_domain: "{{ front_origin_domain }}"

# Подписки не входят в модель FRONT. Клиентские данные будут выдаваться
# отдельными защищёнными JSON-файлами в следующем пакете управления
# пользователями.
front_subscription_enabled: false
