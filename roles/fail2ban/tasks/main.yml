---
- name: "Установка: защита Fail2Ban — этап 1"
  ansible.builtin.apt:
    name: fail2ban
    state: present
    lock_timeout: 600
  when: awg_enable_fail2ban | bool

- name: "Установка: защита Fail2Ban — этап 2"
  ansible.builtin.template:
    src: fail2ban-sshd.local.j2
    dest: "{{ security_fail2ban_file }}"
    owner: root
    group: root
    mode: "0644"
  when: awg_enable_fail2ban | bool
  notify: Перезапустить итоговый Fail2Ban

- name: "Включение: защита Fail2Ban — этап 3"
  ansible.builtin.systemd_service:
    name: fail2ban.service
    enabled: true
    state: started
  when: awg_enable_fail2ban | bool

- name: "Применение: защита Fail2Ban — этап 4"
  ansible.builtin.meta: flush_handlers
  when: awg_enable_fail2ban | bool
