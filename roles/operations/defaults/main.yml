---
awg_server_audit_path: /usr/local/sbin/server-audit
awg_health_script_path: /usr/local/sbin/awg-health
awg_server_audit_service_name: awg-server-audit.service
awg_server_audit_timer_name: awg-server-audit.timer
awg_managed_integrity_path: /usr/local/sbin/awg-managed-integrity
awg_managed_integrity_manifest: /var/lib/awg-iac/security/managed-files.sha256
awg_telegram_monitor_path: /usr/local/sbin/awg-telegram-monitor
awg_telegram_monitor_env_path: /etc/awg-telegram-monitor.env
awg_telegram_monitor_service_name: awg-telegram-monitor.service
awg_telegram_monitor_timer_name: awg-telegram-monitor.timer
awg_telegram_monitor_state_dir: /var/lib/awg-telegram-monitor
awg_telegram_monitor_start_immediately: true
awg_telegram_monitor_deferred_flag: /run/awg-telegram-monitor.deferred
awg_maintenance_path: /usr/local/sbin/maintenance
awg_maintenance_calendar: "*-*-* 05:20:00"
# Что ставит ночное обслуживание:
#   full     - все обновления Ubuntu и новое ядро той же сборки (как update-all);
#   security - только обновления безопасности через unattended-upgrades.
# В обоих режимах AmneziaWG и sing-box не трогаются, перезагрузки нет.
awg_maintenance_upgrade_mode: full
# Проверка обновлений ядра, AmneziaWG и Xray: только сообщает (UPD), ничего
# не устанавливает. Запускается и после ночного обслуживания; версию Xray
# FRONT сверяет с последним стабильным выпуском.
kalimera_updates_path: /usr/local/sbin/kalimera-updates
kalimera_updates_state_dir: /run/kalimera-updates
kalimera_updates_apt_lock_path: /run/awg-apt-maintenance.lock
kalimera_updates_calendar: "*-*-* 06:10:00"
kalimera_updates_xray_releases_api: https://api.github.com/repos/XTLS/Xray-core/releases/latest
# Работа без присмотра. Раз в неделю ENTRY отправляет сводку в Telegram и, если
# после обновления нужна перезагрузка, перезагружает серверы каскада по одному
# (FRONT, EXIT, ENTRY) с проверкой после каждого.
#   awg_weekly_day            - день недели ночного обслуживания, после которого
#                               открывается окно (Mon, Tue, Wed, Thu, Fri, Sat, Sun);
#   awg_weekly_offset_minutes - через сколько минут после начала обслуживания;
#   awg_weekly_calendar       - готовое выражение systemd вместо двух предыдущих.
awg_weekly_day: Sun
awg_weekly_offset_minutes: 90
awg_weekly_calendar: ""
kalimera_weekly_path: /usr/local/libexec/kalimera-weekly
kalimera_controller_venv_path: /root/.local/share/awg-iac/controller-venv
# Автоматическая перезагрузка: false - перезагрузка остаётся за администратором
# (cascade-reboot --yes), сводка продолжает приходить.
awg_auto_reboot_enabled: true
awg_auto_reboot_state_dir: /var/lib/kalimera/cascade-reboot
# Не чаще одного раза за столько дней.
awg_auto_reboot_min_interval_days: 6
# Новое ядро выдерживается столько часов после установки: ошибку в свежем ядре
# Ubuntu обычно находят и исправляют за несколько дней.
awg_auto_reboot_kernel_min_age_hours: 72
# Сторож зависания. systemd отмечается в устройстве сторожа; если отметок нет
# дольше awg_watchdog_runtime_seconds (система зависла), ядро перезагружает сервер.
# Если у сервера нет сторожа гипервизора, загружается программный softdog; если в
# ядре нет и его, настройка ничего не делает. awg_watchdog_reboot_seconds
# ограничивает саму перезагрузку: сервер, застрявший при выключении, тоже
# перезагружается принудительно.
awg_watchdog_enabled: true
awg_watchdog_runtime_seconds: 120
awg_watchdog_reboot_seconds: 600
awg_watchdog_service_name: kalimera-watchdog.service
awg_watchdog_dropin_path: /etc/systemd/system.conf.d/90-kalimera-watchdog.conf
# Нехватка памяти. Службы, через которые идёт трафик каскада, ядро завершает в
# последнюю очередь: раньше них - сборку модуля, обновление пакетов и другие
# разовые задания. Настройка для службы, которой на сервере нет (RU-прокси
# выключен, межсерверный канал работает на модуле ядра), ни на что не влияет.
awg_oom_score_adjust: -500
awg_oom_apply_path: /usr/local/libexec/kalimera-oom-apply
awg_oom_protected_units_by_role:
  entry:
    - unbound.service
    - dnsmasq.service
    - "{{ sing_box_service_name | default('sing-box.service') }}"
    - "{{ front_backend_service_name | default('kalimera-front-backend.service') }}"
    - "{{ awg3_transit_service_name | default('awg3-transit.service') }}"
  exit:
    - unbound.service
    - "{{ awg3_transit_service_name | default('awg3-transit.service') }}"
  front:
    - "{{ front_xray_service_name | default('xray.service') }}"
    - nginx.service
awg_oom_protected_units: "{{ awg_oom_protected_units_by_role[awg_node_role | default('')] | default([]) }}"
awg_domain_policy_dir: /etc/awg/domain-policy
awg_client_output_dir: /root/awg-client-configs
entry_ru_proxy_capability_path: /usr/local/sbin/ru-proxy-capability
awg_local_peer_dir: /etc/awg/client-peers
awg_legacy_local_peer_dir: /etc/awg/legacy-client-peers
awg_mobile_local_peer_dir: /etc/awg/mobile-client-peers
awg_local_peer_apply_path: /usr/local/sbin/awg-local-peer-apply
awg_dns_policy_path: /usr/local/sbin/awg-dns-policy
