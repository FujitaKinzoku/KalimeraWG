---
# Адрес, с которого ENTRY подключается к этому серверу: им пускается ключ отчёта
# cascade-check (from=). ENTRY может стоять за NAT, и тогда его публичный адрес
# локально не виден. Поэтому адрес берётся на этом сервере: сначала из
# SSH_CONNECTION сессии деплоя, затем из TCP-соединения того процесса sshd, в
# котором выполняется эта задача. Ничего не меняет; вызывается из pre_tasks
# плейбуков EXIT и FRONT, то есть до их ролей.
- name: Адрес ENTRY по SSH_CONNECTION сессии деплоя
  ansible.builtin.command:
    argv: [/bin/sh, -c, 'printf "%s" "$SSH_CONNECTION"']
  register: cascade_check_env_connection
  changed_when: false
  become: false
  when: (hostvars[groups['entry'][0]].cascade_check_entry_source_ipv4 | default('')) | length == 0

- name: Адрес ENTRY из SSH_CONNECTION - выбор
  ansible.builtin.set_fact:
    cascade_check_env_source: "{{ (cascade_check_env_connection.stdout | default('')).split() | first | default('') }}"

- name: Адрес ENTRY по TCP-соединению сессии деплоя
  ansible.builtin.shell: |
    set -Eeuo pipefail
    pid=$$
    session=""
    while [ "${pid:-0}" -gt 1 ]; do
      comm="$(cat "/proc/${pid}/comm" 2>/dev/null || true)"
      if [ "$comm" = sshd ] || [ "$comm" = sshd-session ]; then
        session="$pid"
        break
      fi
      pid="$(awk '/^PPid:/ {print $2}' "/proc/${pid}/status" 2>/dev/null || true)"
      [ -n "$pid" ] || break
    done
    [ -n "$session" ] || exit 0
    ss -Htnp state established \
      | awk -v tag="pid=${session}," 'index($0, tag) { print $4; exit }' \
      | sed -E 's/:[0-9]+$//; s/^\[//; s/\]$//; s/^::ffff://'
  args:
    executable: /bin/bash
  register: cascade_check_socket_connection
  changed_when: false
  become: false
  when:
    - (hostvars[groups['entry'][0]].cascade_check_entry_source_ipv4 | default('')) | length == 0
    - cascade_check_env_source is not match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')

- name: Адрес ENTRY для отчёта cascade-check
  ansible.builtin.set_fact:
    security_cascade_report_source_ipv4: >-
      {{ hostvars[groups['entry'][0]].cascade_check_entry_source_ipv4
         if (hostvars[groups['entry'][0]].cascade_check_entry_source_ipv4 | default('')) | length > 0
         else (cascade_check_env_source
               if cascade_check_env_source is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
               else (cascade_check_socket_connection.stdout | default('') | trim)) }}

- name: Проверка адреса ENTRY для отчёта cascade-check
  ansible.builtin.assert:
    quiet: true
    that:
      - security_cascade_report_source_ipv4 is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
      - security_cascade_report_source_ipv4 is not match('^127\.')
    fail_msg: >-
      Не удалось определить адрес ENTRY, с которого он подключается к этому серверу.
      SSH_CONNECTION дал: '{{ cascade_check_env_source | default('') }}',
      TCP-соединение дало: '{{ cascade_check_socket_connection.stdout | default('') | trim }}'.
      Задайте cascade_check_entry_source_ipv4 во inventory ENTRY.
