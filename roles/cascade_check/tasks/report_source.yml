---
# Адрес, с которого ENTRY подключается к этому серверу: им пускается ключ отчёта
# cascade-check (from=). Сначала берётся адрес из SSH_CONNECTION сессии деплоя.
# Если там не IPv4, берётся маршрут с самого ENTRY на этот сервер. Ничего не
# меняет на сервере; вызывается из pre_tasks плейбуков EXIT и FRONT, до их ролей.
- name: Адрес ENTRY по SSH_CONNECTION сессии деплоя
  ansible.builtin.command:
    argv: [/bin/sh, -c, 'printf "%s" "$SSH_CONNECTION"']
  register: cascade_check_connection
  changed_when: false
  become: false
  when: (hostvars[groups['entry'][0]].cascade_check_entry_source_ipv4 | default('')) | length == 0

- name: Адрес ENTRY из SSH_CONNECTION - выбор
  ansible.builtin.set_fact:
    cascade_check_session_source: "{{ (cascade_check_connection.stdout | default('')).split() | first | default('') }}"

- name: Адрес ENTRY для отчёта cascade-check
  ansible.builtin.set_fact:
    security_cascade_report_source_ipv4: >-
      {{ hostvars[groups['entry'][0]].cascade_check_entry_source_ipv4
         if (hostvars[groups['entry'][0]].cascade_check_entry_source_ipv4 | default('')) | length > 0
         else (cascade_check_session_source
               if cascade_check_session_source is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
               else '') }}

- name: Маршрут с ENTRY на этот сервер
  ansible.builtin.command:
    argv: [/usr/sbin/ip, -4, -o, route, get, "{{ hostvars[inventory_hostname].ansible_host }}"]
  delegate_to: "{{ groups['entry'][0] }}"
  register: cascade_check_route
  changed_when: false
  become: false
  when: (security_cascade_report_source_ipv4 | default('')) | length == 0

- name: Адрес ENTRY по маршруту
  ansible.builtin.set_fact:
    security_cascade_report_source_ipv4: >-
      {{ (cascade_check_route.stdout | default(''))
         | regex_search('src ([0-9.]+)', '\\1') | default('', true) }}
  when: (security_cascade_report_source_ipv4 | default('')) | length == 0

- name: Проверка адреса ENTRY для отчёта cascade-check
  ansible.builtin.assert:
    quiet: true
    that:
      - security_cascade_report_source_ipv4 is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
      - security_cascade_report_source_ipv4 is not match('^127\.')
    fail_msg: >-
      Не удалось определить адрес ENTRY, с которого он подключается к этому серверу
      (ни из SSH_CONNECTION, ни по маршруту). Задайте cascade_check_entry_source_ipv4
      во inventory ENTRY.
