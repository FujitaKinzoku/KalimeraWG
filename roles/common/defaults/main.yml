---
common_packages:
  - ca-certificates
  - curl
  - jq
  - iproute2
  - ipset
  - iptables
  - ufw
  - software-properties-common
  - python3-cryptography
  - ssss
  - openssl
awg_backup_root: /root/config-backups
# Ubuntu раз в сутки обновляет по таймеру метаданные прошивок с LVFS. На VPS
# обновляемых прошивок нет, а LVFS с части хостингов недоступен: служба
# зависает на 60 секунд, падает и оставляет failed-модуль, из-за которого
# server-audit не проходит. Пакет fwupd не удаляется, отключается только
# таймер. false - не трогать таймер.
common_disable_fwupd_refresh: true
awg_enable_fail2ban: true
# Источник APT, недоступность которого не останавливает deploy, если
# закреплённые пакеты AmneziaWG уже установлены (см. tasks/apt-refresh.yml).
common_apt_optional_source_pattern: ppa.launchpadcontent.net/amnezia/
common_apt_get_path: /usr/bin/apt-get
common_dpkg_query_path: /usr/bin/dpkg-query
