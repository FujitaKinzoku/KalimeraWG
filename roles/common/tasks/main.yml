---
- name: Обновление списков пакетов с учётом недоступности PPA
  ansible.builtin.include_tasks: apt-refresh.yml

- name: "Установка: базовая система - этап 1"
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: false
    lock_timeout: 600

- name: "Создание: базовая система - этап 2"
  ansible.builtin.file:
    path: "{{ awg_backup_root }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Проверка наличия таймера обновления метаданных прошивок
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/fwupd-refresh.timer
  register: common_fwupd_refresh_timer
  when: common_disable_fwupd_refresh | bool

- name: Отключение таймера обновления метаданных прошивок
  ansible.builtin.systemd_service:
    name: fwupd-refresh.timer
    enabled: false
    state: stopped
  when:
    - common_disable_fwupd_refresh | bool
    - common_fwupd_refresh_timer.stat.exists

- name: Сброс прежнего отказа службы обновления метаданных прошивок
  ansible.builtin.command:
    argv: [/usr/bin/systemctl, reset-failed, fwupd-refresh.service]
  changed_when: false
  failed_when: false
  when:
    - common_disable_fwupd_refresh | bool
    - common_fwupd_refresh_timer.stat.exists

# KalimeraWG поддерживает только Ubuntu 24.04: после перехода на новый выпуск
# deploy останавливается на preflight, а модуль AmneziaWG может не собраться.
# Предложение «New release ... available» скрывается, обновления безопасности
# 24.04 приходят как прежде.
- name: Проверка настроек перехода на новый выпуск Ubuntu
  ansible.builtin.stat:
    path: /etc/update-manager/release-upgrades
  register: common_release_upgrades_config
  when: common_hide_release_upgrade_prompt | bool

- name: Отключение предложения перейти на новый выпуск Ubuntu
  ansible.builtin.lineinfile:
    path: /etc/update-manager/release-upgrades
    regexp: '^\s*Prompt\s*='
    line: Prompt=never
  when:
    - common_hide_release_upgrade_prompt | bool
    - common_release_upgrades_config.stat.exists

- name: Удаление сохранённого предложения нового выпуска из MOTD
  ansible.builtin.file:
    path: /var/lib/ubuntu-release-upgrader/release-upgrade-available
    state: absent
  when: common_hide_release_upgrade_prompt | bool
