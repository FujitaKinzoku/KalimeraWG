---
entry_dns_candidate_root: /run/ansible-entry-dns-candidate
entry_dns_backup_root: /root/config-backups/entry/dns
entry_dns_dot_override_path: /etc/awg/dot-override.json
entry_dns_resolved_dropin_dir: /etc/systemd/resolved.conf.d
entry_dns_resolved_dropin_path: /etc/systemd/resolved.conf.d/60-kalimerawg.conf
entry_dnsmasq_config_dir: /etc/dnsmasq.d
entry_unbound_config_dir: /etc/unbound/unbound.conf.d
# Минимальный TTL в кэше Unbound, секунды. 0 отключает. Пять минут - компромисс:
# короткие записи CDN не перезапрашиваются при каждом подключении, а устаревший
# узел CDN может держаться в кэше до пяти минут после смены.
entry_dns_cache_min_ttl: 300
# Prefetch Unbound: обновлять популярные записи до истечения TTL.
entry_dns_prefetch: true
# Прогрев кэша Unbound: короткие запросы к популярным именам каждые 60 секунд.
# Записи не истекают, DoT-соединения и данные о задержках остаются тёплыми, а
# промах достаётся прогреву, а не пользователю. Ответы нигде не сохраняются.
entry_dns_warm_enabled: true
entry_dns_warm_interval_seconds: 60
entry_dns_warm_names:
  - youtube.com
  - googlevideo.com
  - ytimg.com
  - instagram.com
  - cdninstagram.com
  - telegram.org
  - t.me
  - web.telegram.org
  - whatsapp.com
  - facebook.com
  - x.com
  - tiktok.com
  - discord.com
# Срок жизни данных о задержке до серверов DoT в Unbound, секунды (по умолчанию 900).
entry_dns_infra_host_ttl: 3600
# DoT-серверы по умолчанию: быстрый сервер в Литве и запасной сервер в Швейцарии
# от другого оператора. Применяются, если в inventory списка нет, он пустой или
# содержит только устаревший Mullvad (его публичный DNS прекращён).
entry_dns_default_dot_upstreams:
  - address: 162.254.86.13
    tls_name: vno01.dnscry.pt
  - address: 185.95.218.43
    tls_name: dns.digitale-gesellschaft.ch
entry_dns_inventory_dot_legacy: "{{ (entry_dot_upstreams | default([]) | length > 0) and (entry_dot_upstreams | default([]) | selectattr('tls_name', 'equalto', 'dns.mullvad.net') | list | length == entry_dot_upstreams | default([]) | length) }}"
entry_dns_dot_upstreams_resolved: "{{ entry_dns_default_dot_upstreams if ((entry_dot_upstreams | default([]) | length == 0) or (entry_dns_inventory_dot_legacy | bool)) else entry_dot_upstreams }}"
entry_domain_files_enabled: false
entry_dnsmasq_managed_files:
  - name: 50-awg-base.conf
    template: 50-awg-base.conf.j2
  - name: 60-domain-policy.conf
    template: 60-domain-policy.conf.j2
  - name: 62-force-entry.conf
    template: 62-force-entry.conf.j2
