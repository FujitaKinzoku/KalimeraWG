---
entry_dns_candidate_root: /run/ansible-entry-dns-candidate
entry_dns_backup_root: /root/config-backups/entry/dns
entry_dns_dot_override_path: /etc/awg/dot-override.json
entry_dns_resolved_dropin_dir: /etc/systemd/resolved.conf.d
entry_dns_resolved_dropin_path: /etc/systemd/resolved.conf.d/60-kalimerawg.conf
entry_dnsmasq_config_dir: /etc/dnsmasq.d
entry_unbound_config_dir: /etc/unbound/unbound.conf.d
# Минимальный TTL в кэше Unbound, секунды. 0 отключает. Пять минут - компромисс:
# короткие записи CDN не перезапрашиваются при каждом подключении, а устаревший
# узел CDN может держаться в кэше до пяти минут после смены.
entry_dns_cache_min_ttl: 300
# Prefetch Unbound: обновлять популярные записи до истечения TTL.
entry_dns_prefetch: true
# Прогрев кэша Unbound: короткие запросы к популярным именам каждые 60 секунд.
# Записи не истекают, DoT-соединения и данные о задержках остаются тёплыми, а
# промах достаётся прогреву, а не пользователю. Ответы нигде не сохраняются.
entry_dns_warm_enabled: true
entry_dns_warm_interval_seconds: 60
# Имена, которые приложения резолвят на самом деле. Апексы без A-записи
# (cdninstagram.com, ytimg.com) и апекс googlevideo.com не греем: видео идёт с узлов
# вида rrN---…googlevideo.com, и по списку их не прогреть.
entry_dns_warm_names:
  # YouTube: API, редиректор узлов видео, миниатюры, аватарки, статика Google.
  - youtube.com
  - www.youtube.com
  - m.youtube.com
  - s.youtube.com
  - youtubei.googleapis.com
  - redirector.googlevideo.com
  - i.ytimg.com
  - i1.ytimg.com
  - i9.ytimg.com
  - yt3.ggpht.com
  - yt3.googleusercontent.com
  - www.gstatic.com
  # Instagram
  - instagram.com
  - www.instagram.com
  - i.instagram.com
  - graph.instagram.com
  - scontent.cdninstagram.com
  # Telegram
  - telegram.org
  - t.me
  - web.telegram.org
  - api.telegram.org
  - cdn.telegram.org
  # WhatsApp
  - whatsapp.com
  - web.whatsapp.com
  - mmg.whatsapp.net
  # Facebook
  - facebook.com
  - www.facebook.com
  - graph.facebook.com
  # X
  - x.com
  - twitter.com
  - pbs.twimg.com
  - abs.twimg.com
  # TikTok
  - tiktok.com
  - www.tiktok.com
  - api.tiktok.com
  # Discord
  - discord.com
  - cdn.discordapp.com
  - gateway.discord.gg
# Срок жизни данных о задержке до серверов DoT в Unbound, секунды (по умолчанию 900).
entry_dns_infra_host_ttl: 3600
# То же в режиме «через резолвер EXIT»: сервер пересылки один и стоит за туннелем,
# поэтому сведения о нём живут минуту.
entry_dns_via_exit_infra_host_ttl: 60
# В режиме «через резолвер EXIT» при подключённом резервном EXIT пересылать
# зарубежные имена резолверам обоих серверов. Unbound сам обходит тот, что не
# отвечает, поэтому отказ одного туннеля или резолвера на разрешении имён не
# сказывается. Цена: часть имён разрешается для места резервного EXIT, а не того,
# через который сейчас идёт трафик. false - один резолвер, действующего пути.
entry_dns_via_exit_both: true
# Продолжать проверять сервер пересылки, который Unbound счёл неработающим. Без
# этого после сбоя связи дольше трёх минут зарубежные имена не разрешаются, пока
# не истечёт срок выше.
entry_dns_infra_keep_probing: true
# Размер кэша Unbound. Больше записей остаётся в RAM без вытеснения; на диск не пишется.
entry_dns_msg_cache_size: 32m
entry_dns_rrset_cache_size: 64m
# Prefetch DNSKEY: ключи популярных зон не запрашиваются заново при каждой проверке.
entry_dns_prefetch_key: true
# Секунды после истечения TTL, в течение которых устаревший ответ отдаётся сразу, пока
# Unbound обновляет запись в фоне. 0 отключает. Час покрывает возврат на сайт после
# паузы: имя, которое запрашивали за последний час, отвечает из кэша без похода к
# DoT-серверу. Клиент получает такой ответ с TTL 30 секунд и при следующем запросе
# видит уже обновлённую запись.
entry_dns_serve_expired_ttl: 3600
# DoT-серверы по умолчанию: быстрый сервер в Литве и запасной сервер в Швейцарии
# от другого оператора. Применяются, если в inventory списка нет, он пустой или
# содержит только устаревший Mullvad (его публичный DNS прекращён).
entry_dns_default_dot_upstreams:
  - address: 162.254.86.13
    tls_name: vno01.dnscry.pt
  - address: 185.95.218.43
    tls_name: dns.digitale-gesellschaft.ch
entry_dns_inventory_dot_legacy: "{{ (entry_dot_upstreams | default([]) | length > 0) and (entry_dot_upstreams | default([]) | selectattr('tls_name', 'equalto', 'dns.mullvad.net') | list | length == entry_dot_upstreams | default([]) | length) }}"
entry_dns_dot_upstreams_resolved: "{{ entry_dns_default_dot_upstreams if ((entry_dot_upstreams | default([]) | length == 0) or (entry_dns_inventory_dot_legacy | bool)) else entry_dot_upstreams }}"
# Российские имена в режиме без RU-прокси разрешает Yandex DNS по DoT прямо с ENTRY:
# их трафик выходит с ENTRY, поэтому и резолвер российский. Это зоны .ru и .рф и списки
# ru-domain и entry-domain; имена se-domain внутри этих зон остаются на серверах DoT по
# умолчанию. Остальные имена идут к серверам DoT по умолчанию, как и раньше. С
# RU-прокси в области all этот путь не используется: там российский DoH идёт через
# прокси. В области selected российские сети выходят напрямую с ENTRY, поэтому путь
# работает так же, как без прокси, и имена proxy-domain разрешаются им же.
# Зоны собирает awg-ru-dns-sync в файл 91-awg-ru-dot.conf. Значение false возвращает
# прежнее поведение: все имена через серверы DoT по умолчанию.
entry_dns_ru_dot_enabled: true
entry_dns_ru_dot_zones:
  - ru
  - xn--p1ai
entry_dns_ru_dot_upstreams:
  - address: 77.88.8.8
    tls_name: common.dot.dns.yandex.net
  - address: 77.88.8.1
    tls_name: common.dot.dns.yandex.net
# Российское имя для проверки после сборки зон и в awg-health.
entry_dns_ru_dot_probe_name: yandex.ru
entry_dns_ru_dot_active: "{{ (entry_dns_ru_dot_enabled | bool) and ((not (entry_ru_proxy_enabled | default(false) | bool)) or ((entry_ru_proxy_scope | default('all')) == 'selected')) }}"
# Шифрованный DNS клиентов (DoH). Браузер, который видит в системе адрес известного
# публичного резолвера (приложение AmneziaVPN ставит 1.1.1.1), сам переходит на DoH
# и спрашивает имена у этого резолвера, а не у ENTRY. Тогда на него не действуют
# списки ru-domain, se-domain, entry-domain и proxy-domain, а запрос уходит через
# EXIT. Чтобы браузер остался на резолвере ENTRY, dnsmasq отвечает "нет такого
# имени" на служебные имена DoH: браузер в автоматическом режиме возвращается к
# обычному DNS. DoT клиентов (порт 853) каскад отклоняет давно.
# Ограничения: DoH, заданный в клиенте IP-адресом, так не остановить; браузер, где
# DoH включён в строгом режиме с одним из этих провайдеров, перестанет разрешать
# имена, пока VPN включён. Значение false отключает эти ответы.
entry_dns_client_doh_fallback_enabled: true
entry_dns_client_doh_names:
  # Сигнальное имя Firefox: без адреса в ответе он не включает DoH по умолчанию.
  - use-application-dns.net
  # Обнаружение шифрованного резолвера системой (DDR, RFC 9462).
  - resolver.arpa
  # Cloudflare: chrome., mozilla., security., family.
  - cloudflare-dns.com
  # Google
  - dns.google
  # Quad9
  - dns.quad9.net
  - dns9.quad9.net
  - dns10.quad9.net
  - dns11.quad9.net
  # OpenDNS
  - doh.opendns.com
  - doh.familyshield.opendns.com
  # AdGuard
  - dns.adguard-dns.com
  - unfiltered.adguard-dns.com
  - family.adguard-dns.com
  - dns.adguard.com
  # NextDNS: chromium., firefox.
  - dns.nextdns.io
  # CleanBrowsing, DNS.SB
  - doh.cleanbrowsing.org
  - doh.dns.sb
entry_domain_files_enabled: false
entry_dnsmasq_managed_files:
  - name: 50-awg-base.conf
    template: 50-awg-base.conf.j2
  - name: 60-domain-policy.conf
    template: 60-domain-policy.conf.j2
  - name: 62-force-entry.conf
    template: 62-force-entry.conf.j2
  - name: 64-awg-client-doh.conf
    template: 64-awg-client-doh.conf.j2
