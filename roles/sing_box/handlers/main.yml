---
- name: "Перезапуск: прокси sing-box — этап 1"
  ansible.builtin.systemd_service:
    name: "{{ sing_box_service_name }}"
    state: restarted
  when:
    - entry_ru_proxy_enabled | bool
    - not (sing_box_manual_disabled.stat.exists | default(false))
  listen: Перезапустить sing-box, если он выбран
