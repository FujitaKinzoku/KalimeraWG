---
- name: "Проверка: прокси sing-box — этап 1"
  ansible.builtin.stat:
    path: "{{ entry_ru_proxy_manual_disabled_flag }}"
  register: sing_box_manual_disabled

- name: "Проверка: прокси sing-box — этап 2"
  ansible.builtin.assert:
    quiet: true
    that:
      - entry_sing_box_version | length > 0
      - ansible_architecture in entry_sing_box_packages
      - entry_sing_box_packages[ansible_architecture].url is match('^https://github.com/SagerNet/sing-box/releases/download/')
      - entry_sing_box_packages[ansible_architecture].checksum is match('^sha256:[0-9a-f]{64}$')
      - entry_ru_tun_stack in ['system', 'gvisor', 'mixed']
      - (vault_proxy_username | default(vault_soax_username | default(''))) is string
      - (vault_proxy_password | default(vault_soax_password | default(''))) is string
    fail_msg: "Требуются закреплённый пакет sing-box и зашифрованные учётные данные SOCKS5, если задана аутентификация"
  no_log: true
  when: entry_ru_proxy_enabled | bool

- name: "Проверка постоянного локального переопределения RU-прокси"
  ansible.builtin.stat:
    path: "{{ sing_box_runtime_override_path }}"
  register: sing_box_runtime_override_file
  when: entry_ru_proxy_enabled | bool

- name: "Загрузка постоянного локального переопределения RU-прокси"
  ansible.builtin.slurp:
    path: "{{ sing_box_runtime_override_path }}"
  register: sing_box_runtime_override_content
  when:
    - entry_ru_proxy_enabled | bool
    - sing_box_runtime_override_file.stat.exists
  no_log: true

- name: "Разбор постоянного локального переопределения RU-прокси"
  ansible.builtin.set_fact:
    sing_box_runtime_proxy_override: >-
      {{ (sing_box_runtime_override_content.content | b64decode | from_json)
         if sing_box_runtime_override_file.stat.exists else {} }}
  when: entry_ru_proxy_enabled | bool
  no_log: true

- name: "Проверка постоянного локального переопределения RU-прокси"
  ansible.builtin.assert:
    quiet: true
    that:
      - sing_box_runtime_proxy_override is mapping
      - >-
        sing_box_runtime_proxy_override | length == 0 or
        (sing_box_runtime_proxy_override.server | default('')) is match('^[A-Za-z0-9.-]+$')
      - >-
        sing_box_runtime_proxy_override | length == 0 or
        (sing_box_runtime_proxy_override.server_port | default(0) | int >= 1 and
         sing_box_runtime_proxy_override.server_port | default(0) | int <= 65535)
      - >-
        ((sing_box_runtime_proxy_override.username | default('') | length > 0) ==
         (sing_box_runtime_proxy_override.password | default('') | length > 0))
    fail_msg: "Локальное переопределение RU-прокси повреждено; применить его безопасно невозможно"
  when: entry_ru_proxy_enabled | bool
  no_log: true

- name: Проверка постоянного локального переопределения DoH
  ansible.builtin.stat:
    path: "{{ sing_box_dns_override_path }}"
  register: sing_box_dns_override_file
  when: entry_ru_proxy_enabled | bool

- name: Загрузка постоянного локального переопределения DoH
  ansible.builtin.slurp:
    path: "{{ sing_box_dns_override_path }}"
  register: sing_box_dns_override_content
  when:
    - entry_ru_proxy_enabled | bool
    - sing_box_dns_override_file.stat.exists | default(false)

- name: Разбор постоянного локального переопределения DoH
  ansible.builtin.set_fact:
    sing_box_runtime_dns_override: >-
      {{ (sing_box_dns_override_content.content | b64decode | from_json)
         if (sing_box_dns_override_file.stat.exists | default(false)) else {} }}
  when: entry_ru_proxy_enabled | bool

- name: Проверка структуры постоянного локального переопределения DoH
  ansible.builtin.assert:
    quiet: true
    that:
      - sing_box_runtime_dns_override is mapping
      - >-
        sing_box_runtime_dns_override | length == 0 or
        sing_box_runtime_dns_override.server | default('') | ansible.utils.ipv4
      - >-
        sing_box_runtime_dns_override | length == 0 or
        (sing_box_runtime_dns_override.server_port | default(0) | int >= 1 and
         sing_box_runtime_dns_override.server_port | default(0) | int <= 65535)
      - >-
        sing_box_runtime_dns_override | length == 0 or
        sing_box_runtime_dns_override.tls_name | default('') is match('^[A-Za-z0-9.-]+$')
      - >-
        sing_box_runtime_dns_override | length == 0 or
        sing_box_runtime_dns_override.path | default('') is match('^/[A-Za-z0-9._~!$&()*+,;=:@%/?-]*$')
    fail_msg: "Локальное переопределение DoH повреждено; применить его безопасно невозможно"
  when: entry_ru_proxy_enabled | bool

- name: "Создание: прокси sing-box — этап 3"
  ansible.builtin.file:
    path: "{{ sing_box_package_cache | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: entry_ru_proxy_enabled | bool

- name: "Загрузка: прокси sing-box — этап 4"
  ansible.builtin.get_url:
    url: "{{ entry_sing_box_packages[ansible_architecture].url }}"
    dest: "{{ sing_box_package_cache }}"
    checksum: "{{ entry_sing_box_packages[ansible_architecture].checksum }}"
    owner: root
    group: root
    mode: "0644"
  when: entry_ru_proxy_enabled | bool

- name: "Установка: прокси sing-box — этап 5"
  ansible.builtin.apt:
    deb: "{{ sing_box_package_cache }}"
    state: present
    lock_timeout: 600
  when: entry_ru_proxy_enabled | bool

- name: "Подготовка: прокси sing-box — этап 6"
  ansible.builtin.file:
    path: "{{ sing_box_config_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: entry_ru_proxy_enabled | bool

- name: "Проверка: запасной транспорт REALITY требует активный RU-прокси"
  ansible.builtin.assert:
    quiet: true
    that:
      - entry_ru_proxy_enabled | bool
    fail_msg: >-
      reality_fallback_enabled требует entry_ru_proxy_enabled=true —
      REALITY-путь переиспользует существующий outbound ru-socks (SOAX) для
      RU-ветки маршрутизации, отдельного механизма для неё нет.
  when: reality_fallback_enabled | default(false) | bool

# REALITY выдаёт себя за настоящий TLS-хендшейк reality_fallback_dest: sing-box
# на лету обращается к нему для непрошедших авторизацию соединений. Сайт за
# CDN/балансировщиком нескольких независимых бэкендов для этого непригоден —
# разные бэкенды могут отвечать разными сертификатами или вовсе не поддерживать
# TLS 1.3 одинаково стабильно. Три последовательные пробы с самого ENTRY
# сервера — быстрая проверка перед применением конфигурации, не гарантия (сайт
# также должен быть естественным для аудитории — это уже вручную).
- name: "Проверка REALITY: проба TLS-рукопожатия с dest-сайтом"
  ansible.builtin.shell:
    cmd: |
      host={{ reality_fallback_dest | quote }}
      port={{ reality_fallback_dest_port }}
      output="$(timeout 10 openssl s_client -connect "${host}:${port}" -servername "$host" -tls1_3 </dev/null 2>/dev/null)"
      proto_ok=false
      grep -Eq 'Protocol[[:space:]]*:[[:space:]]*TLSv1\.3' <<<"$output" && proto_ok=true
      fingerprint="$(openssl x509 -noout -fingerprint -sha256 <<<"$output" 2>/dev/null | cut -d= -f2)"
      printf '%s|%s\n' "$proto_ok" "$fingerprint"
    executable: /bin/bash
  register: reality_fallback_dest_probes
  changed_when: false
  loop: "{{ range(0, 3) | list }}"
  when: reality_fallback_enabled | default(false) | bool

- name: "Проверка REALITY: dest-сайт стабильно отвечает TLS 1.3 одним и тем же сертификатом"
  ansible.builtin.assert:
    quiet: true
    that:
      - reality_fallback_dest_probes.results | map(attribute='stdout') | map('trim') | select('match', '^true\\|.+') | list | length == reality_fallback_dest_probes.results | length
      - (reality_fallback_dest_probes.results | map(attribute='stdout') | map('trim') | map('regex_replace', '^true\\|', '') | unique | list | length) == 1
    fail_msg: >-
      dest-сайт {{ reality_fallback_dest }}:{{ reality_fallback_dest_port }}
      непригоден в качестве маски REALITY: при прямом подключении с ENTRY
      сервера он либо не согласовал TLS 1.3, либо в трёх последовательных
      пробах отдал разные сертификаты (частый признак нескольких независимых
      бэкендов за DNS round-robin или CDN — REALITY требует единственный
      настоящий источник с предсказуемым TLS-рукопожатием). Выберите другой
      reality_fallback_dest и повторите развёртывание.
  when: reality_fallback_enabled | default(false) | bool

- name: "Создание: каталог состояния REALITY"
  ansible.builtin.file:
    path: "{{ reality_fallback_state_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: reality_fallback_enabled | default(false) | bool

- name: "Проверка: ключевая пара REALITY уже создана"
  ansible.builtin.stat:
    path: "{{ reality_fallback_private_key_path }}"
  register: reality_fallback_keypair_file
  when: reality_fallback_enabled | default(false) | bool

- name: "Генерация: ключевая пара REALITY"
  ansible.builtin.command:
    argv: [/usr/bin/sing-box, generate, reality-keypair]
  register: reality_fallback_keypair_output
  changed_when: true
  no_log: true
  when:
    - reality_fallback_enabled | default(false) | bool
    - not reality_fallback_keypair_file.stat.exists

- name: "Сохранение: закрытый ключ REALITY"
  ansible.builtin.copy:
    dest: "{{ reality_fallback_private_key_path }}"
    content: >-
      {{ (reality_fallback_keypair_output.stdout_lines
          | select('match', '^PrivateKey:')
          | first).split(':')[1] | trim }}
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when:
    - reality_fallback_enabled | default(false) | bool
    - not reality_fallback_keypair_file.stat.exists

- name: "Сохранение: публичный ключ REALITY"
  ansible.builtin.copy:
    dest: "{{ reality_fallback_state_dir }}/public.key"
    content: >-
      {{ ((reality_fallback_keypair_output.stdout_lines
          | select('match', '^PublicKey:')
          | first).split(':')[1] | trim) + "\n" }}
    owner: root
    group: root
    mode: "0644"
  when:
    - reality_fallback_enabled | default(false) | bool
    - not reality_fallback_keypair_file.stat.exists

- name: "Проверка: short_id REALITY уже создан"
  ansible.builtin.stat:
    path: "{{ reality_fallback_short_id_path }}"
  register: reality_fallback_short_id_file
  when: reality_fallback_enabled | default(false) | bool

- name: "Генерация: short_id REALITY"
  ansible.builtin.shell:
    cmd: "set -o pipefail; /usr/bin/sing-box generate rand --hex 8 > {{ reality_fallback_short_id_path | quote }}"
    executable: /bin/bash
  changed_when: true
  when:
    - reality_fallback_enabled | default(false) | bool
    - not reality_fallback_short_id_file.stat.exists

- name: "Ограничение прав: short_id REALITY"
  ansible.builtin.file:
    path: "{{ reality_fallback_short_id_path }}"
    owner: root
    group: root
    mode: "0644"
  when: reality_fallback_enabled | default(false) | bool

- name: "Проверка: UUID клиента REALITY уже создан"
  ansible.builtin.stat:
    path: "{{ reality_fallback_client_uuid_path }}"
  register: reality_fallback_client_uuid_file
  when: reality_fallback_enabled | default(false) | bool

- name: "Генерация: UUID клиента REALITY"
  ansible.builtin.shell:
    cmd: "set -o pipefail; /usr/bin/sing-box generate uuid > {{ reality_fallback_client_uuid_path | quote }}"
    executable: /bin/bash
  changed_when: true
  when:
    - reality_fallback_enabled | default(false) | bool
    - not reality_fallback_client_uuid_file.stat.exists

- name: "Ограничение прав: UUID клиента REALITY"
  ansible.builtin.file:
    path: "{{ reality_fallback_client_uuid_path }}"
    owner: root
    group: root
    mode: "0644"
  when: reality_fallback_enabled | default(false) | bool

- name: "Чтение: параметры REALITY для рендеринга конфигурации"
  ansible.builtin.slurp:
    path: "{{ item }}"
  loop:
    - "{{ reality_fallback_private_key_path }}"
    - "{{ reality_fallback_short_id_path }}"
    - "{{ reality_fallback_client_uuid_path }}"
  register: reality_fallback_material_raw
  no_log: true
  when: reality_fallback_enabled | default(false) | bool

- name: "Разбор: параметры REALITY для рендеринга конфигурации"
  ansible.builtin.set_fact:
    reality_fallback_private_key: >-
      {{ (reality_fallback_material_raw.results[0].content | b64decode | trim)
         if reality_fallback_enabled | default(false) | bool else '' }}
    reality_fallback_short_id: >-
      {{ (reality_fallback_material_raw.results[1].content | b64decode | trim)
         if reality_fallback_enabled | default(false) | bool else '' }}
    reality_fallback_client_uuid: >-
      {{ (reality_fallback_material_raw.results[2].content | b64decode | trim)
         if reality_fallback_enabled | default(false) | bool else '' }}
  no_log: true
  when: reality_fallback_enabled | default(false) | bool

# Реальное содержимое этих rule-set файлов формируют domain-admin.sh.j2
# (ru-domain/se-domain) и awg-ru-zone-update.sh.j2 (статический список RU
# подсетей) — тот же источник данных, что питает kernel ipset. Здесь только
# гарантируем, что файл существует и валиден к первому запуску sing-box, до
# первого срабатывания этих скриптов.
- name: "Создание: заготовка rule-set REALITY для ru-domain/se-domain"
  ansible.builtin.copy:
    dest: "{{ reality_fallback_ru_rule_set_path }}"
    content: "{\"rules\":[]}\n"
    owner: root
    group: root
    mode: "0644"
    force: false
  when: reality_fallback_enabled | default(false) | bool

- name: "Создание: заготовка rule-set REALITY для российских подсетей"
  ansible.builtin.copy:
    dest: "{{ reality_fallback_ru_zone_rule_set_path }}"
    content: "{\"rules\":[]}\n"
    owner: root
    group: root
    mode: "0644"
    force: false
  when: reality_fallback_enabled | default(false) | bool

- name: "Проверка: прокси sing-box — этап 7"
  ansible.builtin.stat:
    path: "{{ sing_box_config_path }}"
  register: sing_box_live_config
  no_log: true
  when: entry_ru_proxy_enabled | bool

- name: "Безопасное применение: прокси sing-box — этап 8"
  when: entry_ru_proxy_enabled | bool
  block:
    - name: "Формирование: прокси sing-box — этап 9"
      ansible.builtin.template:
        src: config.json.j2
        dest: "{{ sing_box_candidate_path }}"
        owner: root
        group: root
        mode: "0600"
      changed_when: false
      no_log: true

    - name: "Проверка: прокси sing-box — этап 10"
      ansible.builtin.command:
        argv:
          - /usr/bin/sing-box
          - check
          - --config
          - "{{ sing_box_candidate_path }}"
      changed_when: false
      no_log: true

    - name: "Проверка: прокси sing-box — этап 11"
      ansible.builtin.command:
        argv:
          - /usr/bin/cmp
          - --silent
          - "{{ sing_box_config_path }}"
          - "{{ sing_box_candidate_path }}"
      register: sing_box_compare
      changed_when: false
      failed_when: sing_box_compare.rc not in [0, 1]
      when: sing_box_live_config.stat.exists
      no_log: true

    - name: "Определение: прокси sing-box — этап 12"
      ansible.builtin.set_fact:
        sing_box_requires_install: >-
          {{ (not sing_box_live_config.stat.exists) or
             (sing_box_compare.rc | default(1) == 1) }}
      no_log: true

    - name: "Создание: прокси sing-box — этап 13"
      ansible.builtin.file:
        path: "{{ sing_box_backup_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      when:
        - sing_box_live_config.stat.exists
        - sing_box_requires_install | bool

    - name: "Резервное копирование: прокси sing-box — этап 14"
      ansible.builtin.copy:
        src: "{{ sing_box_config_path }}"
        dest: >-
          {{ sing_box_backup_dir }}/config.json.{{ ansible_date_time.iso8601_basic_short }}
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      when:
        - sing_box_live_config.stat.exists
        - sing_box_requires_install | bool
      no_log: true

    - name: "Установка: прокси sing-box — этап 15"
      ansible.builtin.copy:
        src: "{{ sing_box_candidate_path }}"
        dest: "{{ sing_box_config_path }}"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      when: sing_box_requires_install | bool
      notify: Перезапустить sing-box, если он выбран
      no_log: true

  always:
    - name: "Удаление: прокси sing-box — этап 16"
      ansible.builtin.file:
        path: "{{ sing_box_candidate_path }}"
        state: absent
      changed_when: false
      no_log: true

- name: "Создание каталога восстановления маршрутов после запуска sing-box"
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ sing_box_service_name }}.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: entry_ru_proxy_enabled | bool

- name: "Связывание запуска sing-box с восстановлением policy routing"
  ansible.builtin.template:
    src: 50-awg-routing-reconcile.conf.j2
    dest: "/etc/systemd/system/{{ sing_box_service_name }}.d/50-awg-routing-reconcile.conf"
    owner: root
    group: root
    mode: "0644"
  register: sing_box_routing_dropin
  when: entry_ru_proxy_enabled | bool

- name: "Перезагрузка systemd после изменения связи sing-box"
  ansible.builtin.systemd_service:
    daemon_reload: true
  when:
    - entry_ru_proxy_enabled | bool
    - sing_box_routing_dropin.changed

- name: "Применение: прокси sing-box — этап 17"
  ansible.builtin.meta: flush_handlers

- name: "Настройка: прокси sing-box — этап 18"
  ansible.builtin.systemd_service:
    name: "{{ sing_box_service_name }}"
    enabled: "{{ not sing_box_manual_disabled.stat.exists }}"
    state: "{{ sing_box_manual_disabled.stat.exists | ternary('stopped', 'started') }}"
    daemon_reload: true
  no_log: true
  when: entry_ru_proxy_enabled | bool

- name: "Отключение: прокси sing-box — этап 19"
  ansible.builtin.command:
    argv: [/usr/bin/systemctl, disable, --now, "{{ sing_box_service_name }}"]
  register: sing_box_disable_result
  changed_when: sing_box_disable_result.rc == 0
  failed_when: false
  when: not entry_ru_proxy_enabled | bool

- name: "Удаление: прокси sing-box — этап 20"
  ansible.builtin.file:
    path: "{{ sing_box_config_path }}"
    state: absent
  no_log: true
  when: not entry_ru_proxy_enabled | bool

- name: "Удаление связи маршрутизации невыбранного sing-box"
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ sing_box_service_name }}.d/50-awg-routing-reconcile.conf"
    state: absent
  when: not entry_ru_proxy_enabled | bool
