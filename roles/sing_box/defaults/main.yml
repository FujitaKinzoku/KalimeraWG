---
sing_box_package_cache: /var/cache/ansible/sing-box.deb
sing_box_config_path: /etc/sing-box/config.json
sing_box_candidate_path: /run/ansible-sing-box-config.json.candidate
sing_box_backup_dir: /root/config-backups/entry/sing-box
sing_box_service_name: sing-box.service
sing_box_runtime_override_path: /etc/awg/ru-proxy-override.json
sing_box_dns_override_path: /etc/awg/doh-override.json
sing_box_reality_dest_override_path: /etc/awg/reality-dest-override.json
entry_ru_proxy_manual_disabled_flag: /var/lib/awg-routing/ru-proxy.manual-off
# gVisor изолирует TCP/UDP обработку TUN от особенностей системного стека.
# Для policy routing с auto_route=false это надёжнее mixed/system.
entry_ru_tun_stack: gvisor
entry_ru_endpoint_independent_nat: true

# Прежний запасной транспорт VLESS+REALITY может работать внутри основной
# службы sing-box и тогда требует entry_ru_proxy_enabled. Управляемый FRONT
# использует отдельную службу backend и не зависит от жизненного цикла
# SOCKS5/TUN. По умолчанию оба варианта выключены.
reality_fallback_enabled: false
front_enabled: false
front_backend_enabled: "{{ front_enabled | bool }}"
reality_fallback_direct_client_enabled: "{{ not (front_backend_enabled | bool) }}"
reality_fallback_port: 443
reality_fallback_state_dir: /etc/sing-box/reality
reality_fallback_private_key_path: "{{ reality_fallback_state_dir }}/private.key"
reality_fallback_short_id_path: "{{ reality_fallback_state_dir }}/short_id"
reality_fallback_client_uuid_path: "{{ reality_fallback_state_dir }}/client_uuid"
# Производные списки маршрутизации не являются секретами, но должны
# обновляться атомарно отдельными административными службами. Отдельный
# подкаталог позволяет открыть на запись только rule-set, не закрытые ключи
# REALITY в родительском каталоге.
reality_fallback_rule_set_dir: "{{ reality_fallback_state_dir }}/rules"
# Настоящий, доступный TLS 1.3 сайт без ECH - маска для REALITY.
# yandex.ru: собственная инфраструктура Yandex (не за сторонним CDN, в
# отличие от www.microsoft.com - тот отдаётся через Akamai), стабильно
# отдаёт один и тот же сертификат (preflight-проверка на живом каскаде) и
# правдоподобен как RU-трафик. www.debian.org отсеян тем же preflight -
# резолвится в несколько IP (DNS round-robin), сертификат нестабилен между
# пробами. Сменить можно через reality-dest-switch после деплоя.
reality_fallback_dest: yandex.ru
reality_fallback_dest_port: 443
reality_fallback_server_names:
  - "{{ reality_fallback_dest }}"
reality_fallback_ru_rule_set_path: "{{ reality_fallback_rule_set_dir }}/ru-domains.json"
reality_fallback_ru_zone_rule_set_path: "{{ reality_fallback_rule_set_dir }}/ru-zone.json"
# Список se-domain («всегда через EXIT») - производный от того же файла, что
# питает ipset force_exit для клиентов AmneziaWG. Нужен, чтобы исключения
# работали одинаково на обоих транспортах: классификация по российским
# подсетям даёт ложные срабатывания на зарубежных сервисах, отдающихся с
# кеш-узлов внутри РФ (googlevideo.com и прочий Google Global Cache).
reality_fallback_se_rule_set_path: "{{ reality_fallback_rule_set_dir }}/se-domains.json"

# Служебный REALITY-клиент, зарезервированный за FRONT-релеем. Отдельный UUID
# не распространяется конечным пользователям и применяется только на участке
# FRONT → ENTRY.
front_relay_enabled: false
reality_fallback_front_client_uuid_path: "{{ reality_fallback_state_dir }}/front_client_uuid"
