---
- name: "Проверка: рекурсивный DNS EXIT сервера — этап 1"
  ansible.builtin.assert:
    quiet: true
    that:
      - exit_awg_address | default('') | length > 0
      - (exit_awg_address | ansible.utils.ipaddr('address')) is truthy
    fail_msg: "Для рекурсивного DNS EXIT требуется корректный exit_awg_address"
  when: entry_dns_default_via_exit | default(false) | bool

- name: "Установка: рекурсивный DNS EXIT сервера — этап 2"
  ansible.builtin.apt:
    name:
      - unbound
      - unbound-anchor
    state: present
    lock_timeout: 600
  when: entry_dns_default_via_exit | default(false) | bool

- name: "Проверка: рекурсивный DNS EXIT сервера — этап 3"
  ansible.builtin.stat:
    path: "{{ exit_dns_trust_anchor_path }}"
  register: exit_dns_trust_anchor_file
  when: entry_dns_default_via_exit | default(false) | bool

- name: "Подготовка: рекурсивный DNS EXIT сервера — этап 4"
  ansible.builtin.command:
    argv: [/usr/sbin/unbound-anchor, -a, "{{ exit_dns_trust_anchor_path }}"]
  changed_when: true
  failed_when: false
  when:
    - entry_dns_default_via_exit | default(false) | bool
    - not exit_dns_trust_anchor_file.stat.exists

- name: "Создание: рекурсивный DNS EXIT сервера — этап 5"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ exit_dns_config_dir }}"
  when: entry_dns_default_via_exit | default(false) | bool

- name: "Создание: рекурсивный DNS EXIT сервера — этап 6"
  ansible.builtin.file:
    path: "{{ exit_dns_candidate_root }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: entry_dns_default_via_exit | default(false) | bool

- name: "Формирование: рекурсивный DNS EXIT сервера — этап 7"
  ansible.builtin.template:
    src: 90-awg-recursive.conf.j2
    dest: "{{ exit_dns_candidate_root }}/90-awg-recursive.conf"
    owner: root
    group: root
    mode: "0644"
  changed_when: false
  when: entry_dns_default_via_exit | default(false) | bool

- name: "Проверка: рекурсивный DNS EXIT сервера — этап 8"
  ansible.builtin.command:
    argv:
      - /usr/sbin/unbound-checkconf
      - "{{ exit_dns_candidate_root }}/90-awg-recursive.conf"
  changed_when: false
  when: entry_dns_default_via_exit | default(false) | bool

- name: "Установка: рекурсивный DNS EXIT сервера — этап 9"
  ansible.builtin.include_tasks: manage_file.yml
  when: entry_dns_default_via_exit | default(false) | bool

- name: "Удаление: рекурсивный DNS EXIT сервера — этап 10"
  ansible.builtin.file:
    path: "{{ exit_dns_candidate_root }}"
    state: absent
  changed_when: false
  when: entry_dns_default_via_exit | default(false) | bool

- name: "Применение: рекурсивный DNS EXIT сервера — этап 11"
  ansible.builtin.meta: flush_handlers

- name: "Включение: рекурсивный DNS EXIT сервера — этап 12"
  ansible.builtin.systemd_service:
    name: "{{ exit_dns_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
  when: entry_dns_default_via_exit | default(false) | bool

- name: "Удаление: рекурсивный DNS EXIT сервера при отключении"
  ansible.builtin.file:
    path: "{{ exit_dns_config_path }}"
    state: absent
  notify: Перезапустить рекурсивный резолвер EXIT
  when: not (entry_dns_default_via_exit | default(false) | bool)

# UFW-правило для этого порта живёт в роли security (задачи "рекурсивного DNS
# EXIT сервера"), а не здесь: отпечаток управляемой политики UFW фиксируется в
# конце роли security, и правило, добавленное позже (в этой роли), делало бы
# строгую проверку UFW постоянно устаревшей относительно снимка.
